name: laoo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.5
  go_router: ^17.4.0
  http: ^1.2.2
  ffi: 2.2.0
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Variable.ttf

  assets:
    - assets/images/
