name: laoo_meeting
description: "LAOO Meeting application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  laoo_shared_admin:
    path: ../../packages/laoo_shared_admin
  laoo_shared_admin_ui:
    path: ../../packages/laoo_shared_admin_ui
  laoo_shared_core:
    path: ../../packages/laoo_shared_core

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  go_router: ^17.4.0
  http: ^1.2.2
  ffi: 2.2.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.10
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Variable.ttf

  assets:
    - assets/images/
