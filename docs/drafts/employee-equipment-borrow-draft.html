g{color:var(--primary)}.preview-strip .spacer,.topbar .spacer{flex:1}.preview-strip select{width:auto;height:26px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--ink)}.topbar{height:52px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--border)}.brand{min-width:226px;display:flex;align-items:center;gap:9px;color:var(--primary);font-weight:800}.mark{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:15px}.quick{display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}.quick span{font-size:12px;color:var(--muted)}.avatar{width:28px;height:28px;background:var(--tint);color:var(--primary);border-radius:4px;display:grid;place-items:center;font-weight:700}.hamburger{display:none}.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:calc(100vh - 86px)}.sidebar{background:#fff;border-right:1px solid var(--border);padding:12px 8px}.side-heading{padding:10px;color:var(--muted);font-size:12px;font-weight:700}.side-link{width:100%;display:flex;align-items:center;gap:11px;min-height:42px;text-align:left;border:0;border-radius:4px;background:transparent;color:var(--ink);padding:7px 10px;font-size:13px}.side-link .icon{font-size:17px}.side-link:hover,.side-link.active{background:var(--tint);color:var(--primary);font-weight:700}.main{min-width:0;padding:10px}.section{width:100%;background:#fff;border-radius:4px;margin-bottom:6px;padding:10px}.caption{min-height:58px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.caption .star{border:0;background:transparent;color:var(--primary);font-size:23px;line-height:1;padding:3px}.caption-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.filter-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field>span{font-size:12px;color:var(--primary)}.field input,.field select,.field textarea{width:100%;min-height:40px;padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:4px;color:var(--ink)}.field textarea{min-height:80px;resize:vertical}.field.search{width:min(280px,100%)}.field.select{width:min(220px,100%)}.filter-actions{display:flex;gap:8px}.process{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.process-step{position:relative;padding:10px 12px;border-left:2px solid var(--border);min-width:0}.process-step:first-child{border-left:0}.process-step.active{background:var(--tint)}.process-step strong{display:block;font-size:13px}.process-step small{display:block}.process-step .num{color:var(--primary);font-size:12px;font-weight:800}.table-scroll{overflow:auto}.table{width:100%;min-width:850px;border-collapse:collapse}.table th,.table td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}.table th{background:var(--tint);color:var(--primary);font-weight:700}.table th:first-child,.table td:first-child{width:48px}.table th:nth-child(2),.table td:nth-child(2){width:110px}.table .actions{display:flex;gap:4px}.table .actions button{border:0;background:transparent;color:var(--primary);font-size:13px;font-weight:700;padding:5px}.records{display:none}.record{padding:10px;border-bottom:1px solid var(--border)}.record:last-child{border-bottom:0}.record-top{display:flex;align-items:start;justify-content:space-between;gap:8px}.record-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0;font-size:12px;color:var(--muted)}.record-actions{display:flex;gap:8px;flex-wrap:wrap}.pager{height:56px;display:flex;align-items:center;gap:6px}.pager .button{height:34px;min-height:34px;min-width:34px;padding:0 8px}.pager span{margin-left:6px;font-size:13px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:6px}.stack{display:grid;gap:6px}.summary-line{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:9px 0}.summary-line:last-child{border-bottom:0}.summary-line span{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.form-grid .wide{grid-column:span 2}.line-card{border:1px solid var(--border);border-radius:4px;padding:12px;margin-top:6px}.line-top{display:flex;align-items:flex-start;gap:10px}.line-top input[type=checkbox]{accent-color:var(--primary);width:18px;height:18px;margin:3px 0}.line-info{flex:1;min-width:0}.line-info strong{display:block}.line-info small{display:block}.asset-rail{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.rail-node{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px}.rail-node.done{background:var(--tint);border-color:var(--tint);color:var(--primary)}.rail-node.wait{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}.note{padding:10px;background:var(--tint);color:#235746;border-radius:4px;font-size:13px}.note.warn{background:var(--warn-bg);color:#76500e}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.metric b{display:block;font-size:24px;color:var(--primary)}.modal{border:0;border-radius:4px;padding:0;width:min(480px,calc(100vw - 48px));max-height:calc(100vh - 48px);box-shadow:0 18px 50px #10281c33}.modal::backdrop{background:#15231fc0}.modal-inner{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}.modal-header,.modal-footer{flex:none;padding:10px;display:flex;align-items:center;gap:8px}.modal-header{border-bottom:1px solid var(--border)}.modal-header h1{flex:1}.modal-body{overflow:auto;padding:10px;display:grid;gap:16px}.modal-footer{border-top:1px solid var(--border);justify-content:flex-end}.photo-slot{border:1px dashed var(--border);border-radius:4px;padding:10px}.photo-slot input{display:block;width:100%;margin-top:8px}.photo-slot img{display:block;max-width:100%;max-height:160px;margin-top:8px;border-radius:4px}.toast{position:fixed;top:96px;right:12px;z-index:5;padding:10px 12px;max-width:min(390px,calc(100vw - 24px));border-radius:4px;background:color-mix(in srgb,var(--primary) 55%,transparent);color:#fff;box-shadow:0 7px 20px #15231f2b}.toast[hidden]{display:none}.toast button{float:right;border:0;background:transparent;color:#fff;font-size:16px;margin-left:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:899px){.shell{display:block}.sidebar{display:none}.sidebar.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--border)}.side-heading{grid-column:1/-1}.hamburger{display:inline-flex}.brand{min-width:0}.quick{display:none}.table-scroll{display:none}.records{display:block}.detail-layout{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.process-step{padding:8px}}
    @media(max-width:560px){.topbar{height:56px}.topbar .user-name{display:none}.main{padding:8px}.preview-strip .preview-note{display:none}.caption-actions{width:100%;margin-left:0;justify-content:flex-end}.filter-row .field{width:100%}.filter-actions{width:100%}.filter-actions .button{flex:1}.process{grid-template-columns:repeat(2,minmax(0,1fr))}.process-step:nth-child(3){border-left:0;border-top:2px solid var(--border)}.process-step:nth-child(4){border-top:2px solid var(--border)}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pager{flex-wrap:wrap;height:56px}.sidebar.open{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<body>
  <div class="preview-strip"><strong>DRAFT · ระบบยืม–คืนภายในบริษัท</strong><span class="preview-note">ข้อมูลจำลอง · ไม่บันทึกลง API/ฐานข้อมูล</span><span class="spacer"></span><label for="theme">ธีม</label><select id="theme"><option value="green">เขียว LAOO</option><option value="blue">น้ำเงิน</option></select></div>
  <header class="topbar"><button class="button ghost square hamburger" id="hamburger" aria-label="เปิดเมนู">☰</button><div class="brand"><span class="mark">L</span><span>Laoo Platform</span></div><div class="quick"><span>⌂ หน้าแรก</span><span>☆ เมนูลัด</span><span>▣ ข้อมูลสินค้า</span><span>↔ ยืม–คืน</span></div><span class="spacer"></span><span class="user-name">เจ้าหน้าที่คลัง · บริษัท DEMO</span><span class="avatar">ค</span></header>
  <div class="shell"><nav class="sidebar" id="sidebar" aria-label="เมนูคลังสินค้า"></nav><main class="main" id="main"></main></div>
  <dialog class="modal" id="dialog"><div class="modal-inner"><header class="modal-header"><span class="icon">↔</span><h1 id="dialog-title"></h1><button class="button ghost square" id="dialog-x" aria-label="ปิด">×</button></header><div class="modal-body" id="dialog-body"></div><footer class="modal-footer"><button class="button" id="dialog-cancel">ยกเลิก</button><button class="button primary" id="dialog-confirm">บันทึก</button></footer></div></dialog>
  <div class="toast" id="toast" hidden role="status"><button id="toast-x" aria-label="ปิดข้อความ">×</button><span id="toast-text"></span></div>
  <script>
    const menu=[['08008','คำขอยืม','↔'],['08009','งานอนุมัติ','✓'],['08010','ส่งมอบและรับคืน','▣'],['08011','ประวัติและรายงาน','▤'],['08001','ข้อมูลสินค้า · ค่าการยืม','□']];
    const sample=[
      {id:'BR-2026-0101',employee:'กิตติ วงศ์ชัย',department:'IT',items:'โน้ตบุ๊ก Dell Latitude 2 เครื่อง · SN-341, SN-342',route:'หัวหน้า IT → ผู้จัดการ',status:'WAIT_APPROVAL',due:'18/10/2569',warehouse:'คลังกลาง',kind:'serial',remaining:2},
      {id:'BR-2026-0102',employee:'ณัฐชา นาคทอง',department:'ฝ่ายอาคาร',items:'กล้อง Canon EOS R50 · SN-CAM-008',route:'หัวหน้าฝ่ายอาคาร',status:'READY',due:'14/10/2569',warehouse:'คลังกลาง',kind:'serial',remaining:1},
      {id:'BR-2026-0103',employee:'กิตติ วงศ์ชัย',department:'IT',items:'จอภาพ 24 นิ้ว 3 เครื่อง · คืนแล้ว 1 เครื่อง',route:'ไม่ต้องอนุมัติ',status:'PARTIAL_RETURN',due:'20/10/2569',warehouse:'คลังกลาง',kind:'quantity',remaining:2},
      {id:'BR-2026-0104',employee:'พิมพ์ชนก ศรีสุข',department:'ฝ่ายธุรการ',items:'แท็บเล็ต Samsung · SN-TAB-021',route:'หัวหน้าฝ่ายธุรการ',status:'RETURNED',due:'09/10/2569',warehouse:'คลังกลาง',kind:'serial',remaining:0}
    ];
    const labels={WAIT_APPROVAL:['รออนุมัติ','warn'],READY:['พร้อมส่งมอบ','blue'],ISSUED:['ยืมอยู่','blue'],PARTIAL_RETURN:['คืนบางส่วน','warn'],RETURNED:['คืนครบ',''],REJECTED:['ไม่อนุมัติ','danger'],CANCELLED:['ยกเลิก','neutral']};
    let view='08008',showNew=false,favorite=false,cardMode=false,pageNumber=1,filter='',statusFilter='',modalAction=()=>{},toastTimer;
    const $=s=>document.querySelector(s);
    const pill=s=>{const p=labels[s]||[s,'neutral'];return `<span class="pill ${p[1]}">${p[0]}</span>`};
    const statusRail=s=>`<div class="asset-rail" aria-label="เส้นทางอุปกรณ์"><span class="rail-node done">✓ กันของแล้ว</span><span class="rail-node ${s==='WAIT_APPROVAL'?'wait':'done'}">${s==='WAIT_APPROVAL'?'○ รออนุมัติ':'✓ ผ่านขั้นอนุมัติ'}</span><span class="rail-node ${['ISSUED','PARTIAL_RETURN','RETURNED'].includes(s)?'done':'wait'}">${['ISSUED','PARTIAL_RETURN','RETURNED'].includes(s)?'✓':'○'} ส่งมอบ</span><span class="rail-node ${s==='RETURNED'?'done':'wait'}">${s==='RETURNED'?'✓':'○'} รับคืน</span></div>`;
    function toast(message){$('#toast-text').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
    function openModal(title,html,label,action){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#dialog-confirm').textContent=label;modalAction=action;$('#dialog').showModal()}
    function closeModal(){$('#dialog').close()}
    function nav(){const sb=$('#sidebar');sb.innerHTML='<div class="side-heading">ข้อมูลส่วนกลาง / คลังสินค้า</div>'+menu.map(m=>`<button class="side-link ${view===m[0]?'active':''}" data-nav="${m[0]}"><span class="icon">${m[2]}</span><span>${m[1]}</span></button>`).join('');}
    function caption(){const m=menu.find(x=>x[0]===view);let action=view==='08008'?'<button class="button primary" data-action="new">＋ เพิ่มคำขอยืม</button>':'';let switcher=view!=='08001'&&window.innerWidth>=900?`<button class="button square" data-action="mode" aria-label="สลับ List/Card">${cardMode?'☷':'▦'}</button>`:'';return `<section class="section caption"><span class="icon">${m[2]}</span><h1>${m[1]}${showNew&&view==='08008'?' > เพิ่ม':''}</h1><button class="star" data-action="favorite" aria-label="เมนูลัด">${favorite?'★':'☆'}</button><div class="caption-actions">${switcher}${action}</div></section>`}
    function filterBar(){return `<section class="section filter-row"><label class="field search"><span>ค้นหาเลขที่ / พนักงาน / สินค้า</span><input id="search" placeholder="ค้นหาคำขอยืม" value="${filter}"></label><label class="field select"><span>สถานะ</span><select id="status-filter"><option value="">ทั้งหมด</option><option value="WAIT_APPROVAL">รออนุมัติ</option><option value="READY">พร้อมส่งมอบ</option><option value="PARTIAL_RETURN">คืนบางส่วน</option><option value="RETURNED">คืนครบ</option></select></label><div class="filter-actions"><button class="button primary compact" data-action="search">⌕ ค้นหา</button><button class="button compact" data-action="clear">ล้าง Filter</button></div></section>`}
    function rowsForPage(){let rows=sample.filter(r=>!filter||[r.id,r.employee,r.items].some(x=>x.toLowerCase().includes(filter.toLowerCase())));if(statusFilter)rows=rows.filter(r=>r.status===statusFilter);if(view==='08009')rows=rows.filter(r=>r.status==='WAIT_APPROVAL');if(view==='08010')rows=rows.filter(r=>['READY','ISSUED','PARTIAL_RETURN'].includes(r.status));return rows}
    function actionFor(r){if(view==='08009')return `<button data-action="approve" data-id="${r.id}">อนุมัติ</button><button data-action="reject" data-id="${r.id}">ส่งกลับ</button>`;if(view==='08010')return `<button data-action="${r.status==='READY'?'issue':'return'}" data-id="${r.id}">${r.status==='READY'?'ส่งมอบ':'รับคืน'}</button>`;return `<button data-action="detail" data-id="${r.id}">ดูรายการ</button>`}
    function list(){const rows=rowsForPage();const tr=rows.map((r,i)=>`<tr><td>${i+1}</td><td class="actions">${actionFor(r)}</td><td><strong>${r.id}</strong></td><td>${r.employee}<br><small>${r.department}</small></td><td>${r.items}</td><td>${r.due}</td><td>${pill(r.status)}</td></tr>`).join('');const cards=rows.map(r=>`<article class="record"><div class="record-top"><strong>${r.id}</strong>${pill(r.status)}</div><div class="record-meta"><span>${r.employee}</span><span>ครบกำหนด ${r.due}</span></div><div>${r.items}</div>${statusRail(r.status)}<div class="record-actions">${actionFor(r).replaceAll('<button','<button class="button compact"')}</div></article>`).join('');return `<section class="section" style="padding:0"><div class="table-scroll" style="display:${cardMode?'none':''}"><table class="table"><thead><tr><th>ID</th><th>Action</th><th>เลขที่</th><th>ผู้ยืม</th><th>สินค้า / SN</th><th>กำหนดคืน</th><th>สถานะ</th></tr></thead><tbody>${tr||'<tr><td colspan="7">ไม่พบรายการตามเงื่อนไขที่ค้นหา</td></tr>'}</tbody></table></div><div class="records" style="${cardMode?'display:block':''}">${cards||'<div class="record">ไม่พบรายการตามเงื่อนไขที่ค้นหา</div>'}</div></section><section class="section pager"><button class="button" data-action="prev" ${pageNumber===1?'disabled':''}>‹</button><button class="button primary">${pageNumber}</button><button class="button" data-action="next" disabled>›</button><span>${rows.length?`1-${rows.length}`:'0-0'} จาก ${rows.length}</span></section>`}
    function processBar(){return `<section class="section process"><div class="process-step active"><span class="num">01 / เริ่มรายการ</span><strong>คำขอยืม</strong><small>กันจำนวนหรือ SN</small></div><div class="process-step"><span class="num">02 / ตามกติกาสินค้า</span><strong>อนุมัติ</strong><small>เก็บสายอนุมัติ ณ วันที่ขอ</small></div><div class="process-step"><span class="num">03 / เจ้าหน้าที่คลัง</span><strong>ส่งมอบ</strong><small>ถ่ายรูปทุกรายการ</small></div><div class="process-step"><span class="num">04 / ตรวจรับ</span><strong>คืน</strong><small>ถ่ายรูปและคืนยอดคลัง</small></div></section>`}
    function requestForm(){return `${processBar()}<section class="section"><h2>ข้อมูลคำขอ</h2><div class="form-grid" style="margin-top:16px"><label class="field"><span>พนักงานผู้ยืม *</span><select id="employee"><option value="">เลือกพนักงาน</option><option value="กิตติ วงศ์ชัย">กิตติ วงศ์ชัย · IT</option><option value="ณัฐชา นาคทอง">ณัฐชา นาคทอง · ฝ่ายอาคาร</option><option value="พิมพ์ชนก ศรีสุข">พิมพ์ชนก ศรีสุข · ฝ่ายธุรการ</option></select></label><label class="field"><span>คลังต้นทาง *</span><select id="warehouse"><option>คลังกลาง · สาขาหลัก</option></select></label><label class="field"><span>วันที่ต้องการรับ *</span><input type="date" id="borrow-date" value="2026-10-11"></label><label class="field wide"><span>หมายเหตุ</span><input placeholder="เหตุผลการใช้งานหรือสถานที่นำไปใช้"></label></div></section><section class="section"><h2>สินค้าและอุปกรณ์</h2><small>เลือกได้หลายรายการ ระบบจะแยกใบอัตโนมัติเมื่อสายอนุมัติต่างกัน</small>${[{'id':'laptop','name':'โน้ตบุ๊ก Dell Latitude 5420','meta':'SN-341 · คงคลัง 3 เครื่อง · สูงสุด 7 วัน','route':'หัวหน้า IT → ผู้จัดการ','due':'18/10/2569'},{'id':'camera','name':'กล้อง Canon EOS R50','meta':'SN-CAM-008 · คงคลัง 1 เครื่อง · สูงสุด 3 วัน','route':'หัวหน้าฝ่ายอาคาร','due':'14/10/2569'},{'id':'monitor','name':'จอภาพ 24 นิ้ว','meta':'นับจำนวน · คงคลัง 8 เครื่อง · สูงสุด 14 วัน','route':'ไม่ต้องอนุมัติ','due':'25/10/2569'}].map(x=>`<label class="line-card" style="display:block"><span class="line-top"><input type="checkbox" class="item-check" value="${x.id}"><span class="line-info"><strong>${x.name}</strong><small>${x.meta}</small></span><span class="pill">${x.route}</span></span><span class="asset-rail"><span class="rail-node">กำหนดคืนไม่เกิน ${x.due}</span><span class="rail-node">${x.id==='monitor'?'จำนวน 1 เครื่อง':'เลือก SN ที่แสดง'}</span></span></label>`).join('')}</section><section class="section" style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap"><button class="button" data-action="cancel-new">ยกเลิก</button><button class="button primary" data-action="save-request">บันทึกและกันของ</button></section>`}
    function approvalPage(){return `<section class="section note">เจ้าหน้าที่ผู้มีสิทธิ์อนุมัติจะเห็นเฉพาะขั้นที่ส่งถึงตน การอนุมัติใช้ข้อมูลสินค้าและสายอนุมัติที่บันทึกไว้ในคำขอ</section>${filterBar()}${list()}`}
    function transferPage(){return `<section class="section note">ส่งมอบหลังผ่านการอนุมัติครบ หรือสินค้าที่ไม่ต้องอนุมัติ · ถ่ายรูปอย่างน้อย 1 รูปต่อสินค้า/SN ทุกครั้งที่ส่งมอบและรับคืน</section>${filterBar()}${list()}`}
    function historyPage(){return `<div class="metric-grid"><section class="section metric"><small>อยู่ระหว่างยืม</small><b>3</b><span>เครื่อง / ชิ้น</span></section><section class="section metric"><small>รออนุมัติ</small><b>1</b><span>คำขอ</span></section><section class="section metric"><small>คืนบางส่วน</small><b>1</b><span>รายการ</span></section><section class="section metric"><small>เกินกำหนด</small><b>0</b><span>รายการ</span></section></div>${filterBar()}${list()}`}
    function itemPage(){return `<section class="section note">ค่าในหน้านี้เป็นตัวอย่างของช่องที่เพิ่มในหน้าข้อมูลสินค้า 08001 · ฟอร์มจริงต้องอ่านและบันทึกผ่านสิทธิ์แก้สินค้า</section><section class="section"><h2>โน้ตบุ๊ก Dell Latitude 5420 · MT-LT-042</h2><div class="form-grid" style="margin-top:16px"><label class="field"><span>เปิดให้ยืม</span><select><option>ใช่</option><option>ไม่ใช่</option></select></label><label class="field"><span>ต้องขออนุมัติ</span><select><option>ใช่</option><option>ไม่ต้องอนุมัติ</option></select></label><label class="field"><span>ยืมได้สูงสุด (วัน) *</span><input type="number" min="1" value="7"></label><label class="field wide"><span>สายอนุมัติของสินค้านี้</span><select><option>หัวหน้า IT → ผู้จัดการ</option><option>ใช้ค่าเริ่มต้นของบริษัท</option><option>หัวหน้าฝ่ายอาคาร</option></select></label></div><div class="asset-rail"><span class="rail-node done">สินค้า: เปิดให้ยืม</span><span class="rail-node done">ติดตามด้วย SN</span><span class="rail-node wait">สำรอง SN เมื่อบันทึกคำขอ</span></div><div class="button-group" style="justify-content:flex-end;margin-top:16px"><button class="button primary" data-action="save-settings">บันทึกค่าใน Draft</button></div></section><section class="section"><h2>สายอนุมัติเริ่มต้นของบริษัท</h2><p style="margin-top:8px">หัวหน้าฝ่าย → ผู้จัดการ · ใช้เมื่อสินค้าไม่ได้ระบุสายเฉพาะ</p><div class="button-group" style="margin-top:12px"><button class="button" data-action="routes">ดูตัวอย่างตั้งค่าสายอนุมัติ</button></div></section>`}
    function render(){nav();let content=view==='08001'?itemPage():view==='08008'?(showNew?requestForm():`${processBar()}${filterBar()}${list()}`):view==='08009'?approvalPage():view==='08010'?transferPage():historyPage();$('#main').innerHTML=caption()+content;const selected=$('#status-filter');if(selected)selected.value=statusFilter;$('#sidebar').classList.remove('open')}
    function photoFields(r,stage){const photoCount=r.kind==='serial'?Math.min(r.remaining||1,2):1;return Array.from({length:photoCount},(_,i)=>`<div class="photo-slot"><strong>${r.kind==='serial'?`SN ${i+1}`:`สินค้า ${i+1}`} · ${r.items.split(' · ')[0]}</strong><small style="display:block">แนบอย่างน้อย 1 รูป${stage==='issue'?'ก่อนส่งมอบ':'เมื่อรับคืน'}</small><input type="file" accept="image/*" capture="environment" required aria-label="รูป${stage==='issue'?'ส่งมอบ':'รับคืน'}รายการ ${i+1}"><div class="photo-preview"></div></div>`).join('')}
    function openRecord(id){const r=sample.find(x=>x.id===id);openModal(`คำขอยืม > ${r.id}`,`<div class="summary-line"><span>ผู้ยืม</span><strong>${r.employee}</strong></div><div class="summary-line"><span>สินค้า</span><strong>${r.items}</strong></div><div class="summary-line"><span>คลัง</span><strong>${r.warehouse}</strong></div><div class="summary-line"><span>กำหนดคืน</span><strong>${r.due}</strong></div><div class="summary-line"><span>สถานะ</span>${pill(r.status)}</div>${statusRail(r.status)}`,'ปิด',()=>closeModal())}
    function confirmAction(kind,id){const r=sample.find(x=>x.id===id);if(kind==='approve'||kind==='reject'){openModal(`งานอนุมัติ > ${kind==='approve'?'อนุมัติ':'ส่งกลับ'}`,`<p><strong>${r.id}</strong> · ${r.employee}</p><p>${r.items}</p><p class="note">สายอนุมัติ: ${r.route}</p>${kind==='reject'?'<label class="field"><span>เหตุผลที่ส่งกลับ *</span><textarea id="reason" required placeholder="ระบุเหตุผลเพื่อให้เจ้าหน้าที่แก้ไข"></textarea></label>':''}`,kind==='approve'?'อนุมัติ':'ส่งกลับ',()=>{if(kind==='reject'&&!$('#reason').value.trim()){toast('กรุณาระบุเหตุผลที่ส่งกลับ');return}r.status=kind==='approve'?'READY':'REJECTED';closeModal();render();toast(kind==='approve'?'อนุมัติแล้ว · พร้อมส่งมอบ':'ส่งกลับแล้ว · ปล่อยของที่กันไว้')});return}
      const issue=kind==='issue';openModal(`${issue?'ส่งมอบและรับคืน > ส่งมอบ':'ส่งมอบและรับคืน > รับคืน'}`,`<p><strong>${r.id}</strong> · ${r.employee}</p><p>${r.items}</p><div class="note">${issue?'รูปก่อนส่งมอบ':'รูปตอนรับคืน'}ต้องครบทุกสินค้า/SN · ${issue?'ตัดยอดคลังเมื่อยืนยัน':'คืนยอดคลังเฉพาะจำนวนที่รับแล้ว'}</div>${photoFields(r,kind)}${!issue?`<label class="field"><span>จำนวนที่รับคืน *</span><input id="return-qty" type="number" min="1" max="${r.remaining}" value="1" required></label><label class="field"><span>สภาพอุปกรณ์</span><select><option>ใช้งานได้</option><option>พบความเสียหาย</option></select></label>`:''}`,issue?'ยืนยันส่งมอบ':'ยืนยันรับคืน',()=>{const missing=[...$('#dialog-body').querySelectorAll('input[type=file]')].some(x=>!x.files.length);if(missing){toast('กรุณาแนบรูปให้ครบทุกสินค้า/SN');return}if(issue){r.status='ISSUED'}else{const count=Number($('#return-qty').value);if(!Number.isInteger(count)||count<1||count>r.remaining){toast('จำนวนที่รับคืนต้องไม่เกินจำนวนคงค้าง');return}r.remaining-=count;r.status=r.remaining?'PARTIAL_RETURN':'RETURNED'}closeModal();render();toast(issue?'ยืนยันส่งมอบและตัดยอดคลังแล้ว':r.status==='PARTIAL_RETURN'?'รับคืนบางส่วนและคืนยอดคลังแล้ว':'รับคืนครบและคืนยอดคลังแล้ว')})}
    document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;showNew=false;filter='';statusFilter='';render();return}const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;if(action==='new'){showNew=true;render()}else if(action==='cancel-new'){showNew=false;render()}else if(action==='favorite'){favorite=!favorite;render();toast(favorite?'เพิ่มในเมนูลัดแล้ว':'นำออกจากเมนูลัดแล้ว')}else if(action==='mode'){cardMode=!cardMode;render()}else if(action==='search'){filter=$('#search')?.value.trim()||'';statusFilter=$('#status-filter')?.value||'';render()}else if(action==='clear'){filter='';statusFilter='';render()}else if(action==='detail'){openRecord(id)}else if(['approve','reject','issue','return'].includes(action)){confirmAction(action,id)}else if(action==='save-request'){const employee=$('#employee').value,items=[...document.querySelectorAll('.item-check:checked')];if(!employee||!items.length){toast('เลือกพนักงานและสินค้าอย่างน้อย 1 รายการ');return}const groups=new Map();items.forEach(x=>{const route=x.value==='laptop'?'IT':x.value==='camera'?'BUILDING':'DIRECT';groups.set(route,(groups.get(route)||[]).concat(x.value))});let n=0;for(const [route,chosen] of groups){n++;sample.unshift({id:`BR-DEMO-0${n}`,employee,department:'ตัวอย่าง',items:`${chosen.length} รายการ · ${chosen.join(', ')}`,route,status:route==='DIRECT'?'READY':'WAIT_APPROVAL',due:route==='BUILDING'?'14/10/2569':'18/10/2569',warehouse:'คลังกลาง',kind:route==='DIRECT'?'quantity':'serial',remaining:chosen.length})}showNew=false;render();toast(`บันทึกตัวอย่าง ${groups.size} ใบ แยกตามสายอนุมัติและกันของแล้ว`)}else if(action==='save-settings'){toast('บันทึกค่าการยืมใน Draft แล้ว')}else if(action==='routes'){openModal('ข้อมูลสินค้า > สายอนุมัติ',`<p>ค่าเริ่มต้นบริษัท: หัวหน้าฝ่าย → ผู้จัดการ</p><p>สินค้าโน้ตบุ๊ก: หัวหน้า IT → ผู้จัดการ</p><p class="note">เมื่อบันทึกคำขอ ระบบเก็บสำเนาสายอนุมัติในเอกสาร</p>`,'ปิด',()=>closeModal())}});
    $('#dialog-confirm').onclick=()=>modalAction();$('#dialog-x').onclick=closeModal;$('#dialog-cancel').onclick=closeModal;$('#toast-x').onclick=()=>$('#toast').hidden=true;$('#hamburger').onclick=()=>$('#sidebar').classList.toggle('open');$('#theme').onchange=e=>{const blue=e.target.value==='blue';document.documentElement.style.setProperty('--primary',blue?'#2867a4':'#087d68');document.documentElement.style.setProperty('--tint',blue?'#e8f1fa':'#e8f4ef')};window.addEventListener('resize',render);render();
  </script>
</body>
</html>
