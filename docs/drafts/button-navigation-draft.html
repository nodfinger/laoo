<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAOO — Draft เมนูแบบปุ่ม</title>
<style>
@font-face{font-family:NotoThai;src:url("../../assets/fonts/NotoSansThai-Variable.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{--p:#0b8668;--rgb:11,134,104;--on:#fff;--bg:#f5f7f8;--surface:#fff;--text:#202826;--muted:#68736f;--border:#dfe5e2;--r:4px;--shadow:0 8px 22px rgba(25,45,38,.09)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 NotoThai,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.ico{font-size:22px;line-height:1}.top{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid rgba(var(--rgb),.18);position:sticky;top:0;z-index:10}.brand{width:210px;display:flex;align-items:center;gap:10px;min-width:0}.logo{width:34px;height:34px;display:grid;place-items:center;background:var(--p);color:var(--on);border-radius:var(--r);font-size:18px;font-weight:800;box-shadow:0 5px 14px rgba(var(--rgb),.22)}.brand-name{color:var(--p);font-weight:800}.version{font-size:10px;color:var(--muted)}.quick{display:flex;align-items:center;gap:3px;flex:1;min-width:0}.quick button{min-height:36px;padding:0 10px;border:1px solid transparent;border-radius:var(--r);background:transparent;color:var(--p);font-weight:650;white-space:nowrap}.quick button:hover{background:rgba(var(--rgb),.07)}.profile{width:200px;height:38px;padding:0 10px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r);font-weight:650}.shell{min-height:calc(100vh - 52px);display:grid;grid-template-columns:226px minmax(0,1fr);gap:6px;padding:6px}.main,.content{background:var(--surface);border-radius:var(--r);min-width:0}.main{padding:10px;overflow:auto;max-height:calc(100vh - 64px);position:sticky;top:58px;align-self:start}.eyebrow{margin:2px 4px 10px;color:var(--muted);font-size:12px;font-weight:650}.main-list{display:grid;gap:6px}.main-btn{width:100%;min-height:54px;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 9px;text-align:left;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);transition:.15s}.main-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.main-btn[aria-pressed=true]{color:var(--p);background:rgba(var(--rgb),.10);border-color:rgba(var(--rgb),.36);box-shadow:inset 3px 0 var(--p)}.main-ico,.sub-ico{display:grid;place-items:center;color:var(--p);background:rgba(var(--rgb),.09);border-radius:var(--r)}.main-ico{width:34px;height:34px}.main-label{min-width:0;display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:650;line-height:1.25}.count{min-width:24px;height:24px;display:grid;place-items:center;padding:0 5px;color:var(--muted);background:var(--bg);border-radius:var(--r);font-size:11px;font-weight:700}.content{padding:10px}.caption{min-height:54px;display:flex;align-items:center;gap:12px;padding:8px 10px;border-bottom:1px solid var(--border)}.caption-icon{width:36px;height:36px;display:grid;place-items:center;color:var(--p);background:rgba(var(--rgb),.09);border-radius:var(--r)}.caption-copy{min-width:0;flex:1}.caption h1{margin:0;color:#171c1a;font-size:18px;line-height:1.3}.caption p{margin:2px 0 0;color:var(--muted);font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.chip{min-height:28px;display:inline-flex;align-items:center;padding:3px 9px;color:var(--p);background:rgba(var(--rgb),.08);border-radius:var(--r);font-size:11px;font-weight:700}.tools{display:grid;grid-template-columns:minmax(220px,430px) auto;align-items:center;gap:10px;padding:10px 0}.search{position:relative}.search span{position:absolute;left:12px;top:10px;color:var(--muted)}.search input,.state{width:100%;height:42px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}.search input{padding:0 12px 0 40px}.state{min-width:150px;padding:0 10px}.mobile-menu{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-content:start}.sub-btn{min-width:0;min-height:122px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px;text-align:left;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 2px 8px rgba(22,42,35,.04);transition:.15s}.sub-btn:hover{transform:translateY(-2px);border-color:rgba(var(--rgb),.34);box-shadow:var(--shadow)}.sub-btn[aria-current=page]{background:rgba(var(--rgb),.08);border-color:rgba(var(--rgb),.44);box-shadow:inset 0 -3px var(--p)}.sub-ico{width:42px;height:42px}.sub-name{min-height:39px;display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;font-weight:700;line-height:1.3}.code{margin-top:4px;color:var(--muted);font-size:11px}.skeleton{min-height:122px;border-radius:var(--r);background:linear-gradient(90deg,#eef2f0 25%,#fafbfa 50%,#eef2f0 75%);background-size:200% 100%;animation:shine 1.2s linear infinite}@keyframes shine{to{background-position:-200% 0}}.empty{min-height:300px;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r)}.empty strong{display:block;color:var(--text);font-size:16px}.slide-note{display:none;min-height:calc(100vh - 84px);place-items:center;text-align:center}.slide-card{width:min(560px,100%);padding:26px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r)}.slide-card b{display:block;margin:10px 0 5px;font-size:18px}.style-slide .button-ui{display:none}.style-slide .slide-note{display:grid}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(var(--rgb),.25);outline-offset:2px}dialog{width:100%;max-width:none;max-height:78vh;margin:auto 0 0;padding:0;color:var(--text);background:var(--surface);border:0;border-radius:12px 12px 0 0;box-shadow:0 -14px 40px rgba(24,32,29,.18)}dialog::backdrop{background:rgba(18,25,23,.42)}.handle{width:44px;height:4px;margin:8px auto 4px;background:var(--border);border-radius:99px}.sheet-head{min-height:48px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border)}.sheet-head h2{flex:1;margin:0;font-size:18px}.close{width:40px;height:40px;color:var(--p);background:transparent;border:1px solid var(--border);border-radius:var(--r)}.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px;overflow:auto}.sheet-btn{min-width:0;min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 6px;text-align:center;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}.sheet-btn[aria-pressed=true]{color:var(--p);background:rgba(var(--rgb),.09);border-color:rgba(var(--rgb),.4)}.sheet-btn span:last-child{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:650;line-height:1.25}
@media(min-width:1500px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:1100px) and (min-width:900px){.shell{grid-template-columns:210px minmax(0,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick button:nth-child(n+4){display:none}}
@media(max-width:899px){.top{height:56px;padding:0 10px;gap:8px}.brand{width:auto;flex:1}.version,.quick{display:none}.profile{width:132px;min-width:0}.shell{display:block;min-height:calc(100vh - 56px);padding:6px}.main{display:none}.content{min-height:calc(100vh - 68px)}.caption{align-items:flex-start}.caption p,.chips{display:none}.tools{grid-template-columns:1fr auto}.mobile-menu{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;color:var(--on);background:var(--p);border:1px solid var(--p);border-radius:var(--r);font-weight:700}.state{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.style-slide .button-ui{display:block}.style-slide .slide-note{display:none}}
@media(max-width:560px){.top{padding:0 8px}.brand-name{font-size:13px}.profile{width:112px;font-size:12px}.content{padding:8px}.caption{padding:7px 6px}.caption h1{font-size:18px}.tools{grid-template-columns:1fr}.mobile-menu{width:100%}.grid,.sheet-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{gap:8px}.sub-btn{min-height:118px;padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.sheet-btn .ico{color:var(--p)}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">L</div><div><div class="brand-name">LAOO Platform</div><div class="version">Version 1.0.0</div></div></div><nav class="quick" aria-label="เมนูลัด"><button>⌂ หน้าหลัก</button><button>☆ เมนูลัดของฉัน</button><button>◷ บันทึกเวลา</button><button>▣ จองห้องประชุม</button><button>▤ ขายหน้าร้าน</button></nav><select id="profile" class="profile" aria-label="เลือกโปรไฟล์ตัวอย่าง"></select></header>
<main class="shell"><aside class="main" aria-label="เมนูหลัก"><div class="eyebrow">ระบบที่คุณมีสิทธิ์ใช้งาน</div><div id="mainList" class="main-list"></div></aside><section class="content"><div class="button-ui"><div class="caption"><div id="capIcon" class="caption-icon"></div><div class="caption-copy"><h1 id="capTitle"></h1><p id="capDesc"></p></div><div class="chips"><span id="themeChip" class="chip"></span><span id="styleChip" class="chip"></span><span class="chip">VIEW Permission</span></div></div><div class="tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="ค้นหาเมนูย่อย" autocomplete="off"></label><div style="display:flex;gap:8px"><select id="viewState" class="state" aria-label="สถานะตัวอย่าง"><option value="loaded">ข้อมูลปกติ</option><option value="loading">กำลังโหลด</option><option value="empty">ไม่มีเมนู</option></select><button id="openSheet" class="mobile-menu">▦ เลือกเมนูหลัก</button></div></div><div id="subRegion" aria-live="polite"></div></div><div class="slide-note"><div class="slide-card"><span class="ico">▥</span><b>โปรไฟล์นี้ตั้งค่าเมนูแบบ Slide</b><span>Desktop จะแสดง Sidebar ตามค่า menuStyleCode = SLIDE แต่หน้าจอแคบกว่า 900px จะเปลี่ยนเป็นเมนูปุ่มอัตโนมัติ</span></div></div></section></main>
<dialog id="sheet"><div class="handle"></div><div class="sheet-head"><span class="ico">▦</span><h2>เลือกเมนูหลัก</h2><button id="closeSheet" class="close" aria-label="ปิดเมนู">✕</button></div><div id="sheetGrid" class="sheet-grid"></div></dialog>
<script>
const profiles=[{id:'c111',name:'c111 · Emerald',theme:'STYLE01',style:'BUTTON',p:'#0b8668',rgb:'11,134,104',bg:'#f5f7f8',text:'#202826',muted:'#68736f',border:'#dfe5e2'},{id:'admin',name:'Admin · Rose',theme:'STYLE04',style:'BUTTON',p:'#ed3f6d',rgb:'237,63,109',bg:'#f8f6f7',text:'#292124',muted:'#766970',border:'#eadde2'},{id:'supervisor',name:'Supervisor · Indigo (Slide)',theme:'STYLE08',style:'SLIDE',p:'#4f64c8',rgb:'79,100,200',bg:'#f5f6fa',text:'#232735',muted:'#687087',border:'#dfe2ed'}];
const groups=[
{code:'CORE',name:'ข้อมูลส่วนกลาง',icon:'◉',desc:'ข้อมูลหลักที่ใช้ร่วมกันทุกระบบ',items:[['01001','ข้อมูลบริษัท','⚙'],['01002','สาขาและพื้นที่ปฏิบัติงาน','⌂'],['01003','พนักงานและผู้ใช้งาน','♙'],['01004','สินค้าและวัสดุ','◇'],['01005','ลูกค้าและคู่ค้า','♧'],['01006','สิทธิ์การใช้งาน','♢']]},
{code:'MEETING',name:'ระบบห้องประชุม',icon:'▣',desc:'จอง อนุมัติ Check-in และคืนห้อง',items:[['19001','ตั้งค่าห้องประชุม','⚙'],['19002','รายการขออนุมัติห้องประชุม','▤'],['19003','จองห้องประชุมและอบรม','▣'],['19004','ปฏิทินห้องประชุม','▦'],['19005','การเตรียมห้องและอุปกรณ์','◇'],['19006','รายงานการใช้ห้องประชุม','▥']]},
{code:'SERVICE',name:'ระบบแจ้งซ่อม',icon:'⚒',desc:'รับเรื่อง มอบหมาย ติดตาม และปิดงานบริการ',items:[['17001','กระดานจ่ายงานช่าง','⚒'],['17002','งานของฉัน','▤'],['17003','รายการแจ้งซ่อมทั้งหมด','▤'],['17004','ประเมินงานบริการ','☑'],['17005','รายงานงานบริการ','▥']]},
{code:'SURVEY',name:'ระบบแบบสอบถาม',icon:'☑',desc:'ออกแบบ เผยแพร่ ตอบ และสรุปแบบสอบถาม',items:[['40001','ประเภทแบบสอบถาม','⚙'],['40002','แบบสอบถาม','☑'],['40003','ชุดคำถามและตัวเลือก','▤'],['40004','เผยแพร่แบบสอบถาม','▣'],['40005','ผลและรายงานแบบสอบถาม','▥'],['40007','แบบสอบถามของฉัน','☑']]},
{code:'EXPENSE',name:'ระบบบันทึกค่าใช้จ่าย',icon:'฿',desc:'บันทึกค่าใช้จ่าย เอกสาร และ Dashboard',items:[['41001','ประเภทค่าใช้จ่าย','⚙'],['41002','บันทึกค่าใช้จ่ายอิสระ','฿'],['41003','รายการค่าใช้จ่าย','▤'],['41004','เอกสารประกอบค่าใช้จ่าย','▧'],['41005','Dashboard ค่าใช้จ่ายหลายมิติ','▥']]},
{code:'INTRANET',name:'ระบบ Intranet',icon:'◎',desc:'ข่าวสาร ประกาศ เอกสาร และบริการภายใน',items:[['43001','จัดการข่าวสารและประกาศ','▤'],['43002','หมวดหมู่เนื้อหา','⚙'],['43003','เอกสารภายในองค์กร','▧'],['43004','หน้าหลัก Intranet','⌂'],['43005','รายงานการเข้าชม','▥']]},
{code:'SALES',name:'ระบบบริหารงานขาย',icon:'↗',desc:'ลูกค้า โอกาสการขาย และเอกสารธุรกิจ',items:[['45001','ข้อมูลลูกค้า','♧'],['45002','โอกาสการขาย','↗'],['45003','ใบเสนอราคา','▧'],['45004','ใบรับรองสินค้า','▤'],['45005','ใบส่งของ','▤'],['45006','ใบกำกับภาษี','▧'],['45007','รายงานยอดขาย','▥']]},
{code:'POS',name:'ระบบขายหน้าร้าน',icon:'▤',desc:'จุดขาย เครื่องขาย สินค้า กะเงินสด และรายงาน',items:[['46001','ตั้งค่าระบบ POS','⚙'],['46002','จุดขายและเครื่องขาย','▣'],['46003','สินค้า ราคา และสต๊อกตามจุดขาย','◇'],['46004','ขายหน้าร้าน','▤'],['46005','กะเงินสด','฿'],['46006','คืนและยกเลิกรายการขาย','↶'],['46007','รายงาน POS','▥']]},
{code:'GATE',name:'ระบบนำทรัพย์สินออกนอกพื้นที่',icon:'♢',desc:'คำขอ ส่งมอบ ตรวจผ่านจุดออก และประวัติ',items:[['38001','ตั้งค่าระบบนำทรัพย์สินออก','⚙'],['38002','ประเภททรัพย์สิน','◇'],['38003','คำขอนำทรัพย์สินออก','▤'],['38004','ส่งมอบให้ผู้นำของออก','♙'],['38005','ตรวจผ่านจุดออก','♢'],['38006','ติดตามสถานะคำขอ','◷'],['38007','ประวัติการนำทรัพย์สินออก','▥']]}
];
const s={profile:profiles[0],group:'POS',item:'46004',view:'loaded',query:''};
const $=id=>document.getElementById(id),group=()=>groups.find(x=>x.code===s.group)||groups[0],compact=()=>matchMedia('(max-width:899px)').matches;
function applyProfile(p){s.profile=p;let r=document.documentElement.style;r.setProperty('--p',p.p);r.setProperty('--rgb',p.rgb);r.setProperty('--bg',p.bg);r.setProperty('--text',p.text);r.setProperty('--muted',p.muted);r.setProperty('--border',p.border);document.body.classList.toggle('style-slide',p.style==='SLIDE');$('themeChip').textContent=p.theme;styleChip()}
function styleChip(){$('styleChip').textContent=compact()?'BUTTON · Responsive':s.profile.style}
function selectGroup(code,close=false){s.group=code;s.item=null;s.query='';$('search').value='';render();if(close)$('sheet').close()}
function renderMain(){$('mainList').innerHTML=groups.map(g=>`<button class="main-btn" aria-pressed="${g.code===s.group}" data-group="${g.code}"><span class="main-ico ico">${g.icon}</span><span class="main-label">${g.name}</span><span class="count">${g.items.length}</span></button>`).join('');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>selectGroup(b.dataset.group))}
function renderSheet(){$('sheetGrid').innerHTML=groups.map(g=>`<button class="sheet-btn" aria-pressed="${g.code===s.group}" data-sheet="${g.code}"><span class="ico">${g.icon}</span><span>${g.name}</span></button>`).join('');document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>selectGroup(b.dataset.sheet,true))}
function renderContent(){let g=group();$('capIcon').innerHTML=`<span class="ico">${g.icon}</span>`;$('capTitle').textContent=g.name;$('capDesc').textContent=g.desc;if(s.view==='loading'){$('subRegion').innerHTML=`<div class="grid">${'<div class="skeleton"></div>'.repeat(8)}</div>`;return}let q=s.query.trim().toLocaleLowerCase('th'),items=s.view==='empty'?[]:g.items.filter(i=>`${i[0]} ${i[1]}`.toLocaleLowerCase('th').includes(q));if(!items.length){$('subRegion').innerHTML=`<div class="empty"><div><span class="ico">⌕</span><strong>${q?'ไม่พบเมนูที่ตรงกับคำค้นหา':'ยังไม่มีเมนูที่ได้รับสิทธิ์ในหมวดนี้'}</strong><span>ลองเปลี่ยนคำค้นหา หรือติดต่อผู้ดูแลสิทธิ์</span></div></div>`;return}$('subRegion').innerHTML=`<div class="grid">${items.map(i=>`<button class="sub-btn" aria-current="${i[0]===s.item?'page':'false'}" data-item="${i[0]}"><span class="sub-ico ico">${i[2]}</span><span><span class="sub-name">${i[1]}</span><span class="code">MenuCode ${i[0]}</span></span></button>`).join('')}</div>`;document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{s.item=b.dataset.item;renderContent()})}
function render(){renderMain();renderSheet();renderContent();styleChip()}
$('profile').innerHTML=profiles.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('profile').onchange=e=>{applyProfile(profiles.find(p=>p.id===e.target.value)||profiles[0]);render()};$('search').oninput=e=>{s.query=e.target.value;renderContent()};$('viewState').onchange=e=>{s.view=e.target.value;renderContent()};$('openSheet').onclick=()=>$('sheet').showModal();$('closeSheet').onclick=()=>$('sheet').close();matchMedia('(max-width:899px)').addEventListener('change',styleChip);
const params=new URLSearchParams(location.search),previewProfile=profiles.find(p=>p.id===params.get('profile'))||profiles[0],previewState=['loaded','loading','empty'].includes(params.get('state'))?params.get('state'):'loaded';s.view=previewState;$('profile').value=previewProfile.id;$('viewState').value=previewState;applyProfile(previewProfile);render();if(location.hash==='#menu-sheet')setTimeout(()=>$('sheet').showModal(),80);
</script>
</body>
</html>
