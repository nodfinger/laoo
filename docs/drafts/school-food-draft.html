<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAOO School Food • Draft</title>
<style>
@font-face{font-family:NotoSansThai;src:url('../../assets/fonts/NotoSansThai-Variable.ttf')}*{box-sizing:border-box}:root{--p:#118363;--soft:#e8f4ef;--bg:#f8f9fb;--line:#e1e5e8;--muted:#66736f;--error:#bd3030}body{margin:0;background:var(--bg);font:14px/1.6 NotoSansThai,Tahoma,sans-serif;color:#202a29}button,input,select{font:inherit;min-width:0}button{min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--p);cursor:pointer;font-size:13px;font-weight:600}button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus,select:focus{outline:2px solid var(--p);outline-offset:2px}.primary{background:var(--p);color:white}.primary:hover{background:var(--p);filter:brightness(.95)}input,select{width:100%;min-height:48px;padding:10px;border:1px solid var(--line);border-radius:4px;background:white}input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--p)}label{display:grid;gap:5px}h1,h2,p{margin:0}h1{font-size:18px;color:black}h2{font-size:16px}small,.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.spread{justify-content:space-between}.card{background:white;border-radius:4px;padding:10px;margin-bottom:6px;min-width:0}.toolbar{background:var(--soft);padding:8px 12px}.toolbar select{width:auto;max-width:150px}.head{height:56px;padding:0 12px;background:white;border-bottom:1px solid var(--line)}.brand{font-weight:800;color:var(--p)}.layout{display:grid;grid-template-columns:235px minmax(0,1fr)}nav{background:white;padding:12px;min-height:85vh}nav button{display:block;text-align:left;border:0;width:100%;margin:4px 0}nav .active{background:var(--soft)}nav small{font-size:11px}main{padding:10px;min-width:0}.caption{min-height:68px}.icon{color:var(--p);font-size:24px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.form{display:grid;gap:16px;padding:10px 0}.actions{display:flex;justify-content:flex-end;gap:8px;padding-top:10px;border-top:1px solid var(--line)}.pos{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px}.identity{background:var(--soft);padding:14px;margin:12px 0}.money{font-size:36px;font-weight:750;line-height:1.3;font-variant-numeric:tabular-nums}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.product{min-height:160px;padding:12px;text-align:left;display:grid;gap:8px;color:inherit}.art{height:60px;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px}.price{font-size:24px;color:var(--p);font-weight:700}.basket{align-self:start;position:sticky;top:10px}.line{padding:12px 0;border-bottom:1px solid var(--line)}.full{width:100%}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.notice{padding:12px;background:var(--soft);margin:10px 0;border-radius:4px}.tablewrap{overflow:auto;padding:0}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--soft);color:var(--p)}.records{display:none;gap:6px}.record{background:white;border-radius:4px;padding:14px;overflow-wrap:anywhere}.record p{margin-bottom:6px}.pagination{height:56px}.pagination button{min-height:34px;width:34px;padding:0}.cards .tablewrap{display:none}.cards .records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:16px}.stat strong{display:block;font-size:28px;color:var(--p)}dialog{padding:0;border:0;border-radius:4px;width:480px;max-width:calc(100vw - 48px);max-height:calc(100dvh - 48px);background:white}dialog::backdrop{background:#0006}.dialog-layout{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}.dialog-head{padding:10px;border-bottom:1px solid var(--line);min-height:48px}.dialog-head h2{font-size:18px}.dialog-body{overflow:auto;padding:10px;display:grid;gap:16px}.dialog-foot{padding:10px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.dialog-foot button{min-width:84px}.dialog-foot .primary{min-width:100px}.toast{position:fixed;right:16px;top:140px;z-index:100;background:color-mix(in srgb,var(--p) 50%,transparent);backdrop-filter:blur(14px);border-radius:4px;padding:12px;max-width:calc(100vw - 32px);box-shadow:0 3px 14px #0002}.toast[hidden]{display:none}.error{color:var(--error)}.mobilemenu{display:none}
@media(max-width:1100px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:minmax(0,1fr) 280px}}@media(max-width:899px){.layout{display:block}nav{display:none;min-height:0}nav.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.mobilemenu{display:block}.pos{grid-template-columns:1fr}.basket{position:static}.tablewrap{display:none}.records,.cards .records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.toggleView{display:none}}@media(max-width:550px){.fields,.records,.cards .records,.stats{grid-template-columns:1fr}.toolbar{font-size:12px}.toolbar select{font-size:12px;max-width:130px}.toolbar small{flex-basis:100%}.caption h1{min-width:155px}.money{font-size:30px}.pagination{font-size:12px}}
</style></head><body>
<div class="toolbar row"><strong>แบบร่าง • School Food</strong><small class="grow">ข้อมูลจำลอง · โหลดใหม่เพื่อเริ่มต้น · ไม่มีการหักเงินจริง</small><select id="role" aria-label="บทบาท"><option value="school">โรงเรียน</option><option value="shop">ร้านค้า</option><option value="guardian">ผู้ปกครอง</option><option value="student">นักเรียน</option></select><select id="theme" aria-label="ธีม"><option value="green">ธีมเขียว</option><option value="blue">ธีมน้ำเงิน</option></select><button id="network">● Online</button></div>
<header class="head row"><button id="menu" class="mobilemenu" aria-label="เปิดเมนู">☰</button><span class="brand">LAOO / SCHOOL FOOD</span><span class="grow"></span><small id="user"></small></header><div class="layout"><nav id="nav" aria-label="เมนูระบบ"></nav><main id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><form id="dialogForm" class="dialog-layout"><header class="dialog-head row"><span class="icon">▤</span><h2 id="dialogTitle"></h2></header><div id="dialogBody" class="dialog-body"></div><footer class="dialog-foot"><button id="cancel" type="button">ยกเลิก</button><button type="submit" class="primary">▣ บันทึก</button></footer></form></dialog><div id="toast" class="toast row" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
// Ephemeral fixtures only. No API requests, persistent storage or biometric samples.
const menus=[['ตั้งค่าระบบขายอาหารในโรงเรียน',2,'⚙'],['ข้อมูลร้านค้าในโรงเรียน',1,'▥'],['สินค้าที่ขายแยกตามร้านค้า',2,'▦'],['กำหนดเปอร์เซ็นต์หักยอดขาย',2,'%'],['บัตรและลายนิ้วมือนักเรียน',1,'▣'],['โอนและรับสต๊อกร้านค้า',4,'⇄'],['Wallet และการเติมเงิน',4,'▤'],['ขายหน้าร้าน',4,'▦'],['ประวัติขายและคืนสินค้า',4,'↶'],['ประวัติการซื้อของนักเรียน',3,'◷'],['กระทบยอดร้านค้า',3,'≡'],['Dashboard และรายงาน',3,'▥']];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const shops=[{id:1,name:'ครัวอิ่มอร่อย',stock:true},{id:2,name:'เครื่องดื่มสดชื่น',stock:false}],products=[{id:1,name:'ข้าวไก่กระเทียม',price:35,stock:20,type:'อาหาร'},{id:2,name:'ข้าวผัดไข่',price:30,stock:15,type:'อาหาร'},{id:3,name:'ไข่ต้ม',price:10,stock:25,type:'อาหารเสริม'},{id:4,name:'น้ำเปล่า',price:7,stock:40,type:'เครื่องดื่ม'},{id:5,name:'นมสด',price:20,stock:0,type:'เครื่องดื่ม'},{id:6,name:'น้ำผลไม้',price:15,stock:0,type:'เครื่องดื่ม'}],assigned={1:new Set([1,2,3,4]),2:new Set([5,6])},students=[{id:1,name:'ภูมิพัฒน์ แสงทอง',code:'660214',room:'ม.3/2',balance:150},{id:2,name:'พิมพ์ชนก ดีพร้อม',code:'660229',room:'ม.3/2',balance:15}];
let page=7,role='school',shop=1,student=null,cart={},online=true,cardView=false,index=0,search='',seconds=3,enabled=true,rate=5,timer,saveDialog,received=false;
const sales=[],favorites=new Set(),cardsData=[{code:'CARD-660214',student:1,active:true},{code:'CARD-660229',student:2,active:true}];
const shopNow=()=>shops.find(x=>x.id===shop),total=()=>Object.entries(cart).reduce((s,[id,q])=>s+products.find(p=>p.id===+id).price*q,0);
function notify(message,detail=''){clearTimeout(timer);$('#toast').hidden=false;$('#toast').innerHTML='<div><strong>'+esc(message)+'</strong>'+(detail?'<div>รายละเอียดเพิ่มเติม: '+esc(detail)+'</div>':'')+'</div><button aria-label="ปิด" onclick="this.parentElement.hidden=true">×</button>';timer=setTimeout(()=>$('#toast').hidden=true,seconds*1000)}
function go(p){page=p;index=0;search='';$('#nav').classList.remove('open');render()}
function render(){const personal=['guardian','student'].includes(role);$('#user').textContent={school:'เจ้าหน้าที่โรงเรียน',shop:'ร้านครัวอิ่มอร่อย',guardian:'ผู้ปกครอง',student:'นักเรียน'}[role];$('#nav').innerHTML=personal?'<p>บัญชีส่วนบุคคล</p>':menus.map((m,i)=>role==='shop'&&![2,5,7,8,10,11].includes(i)?'':'<button class="'+(page===i?'active':'')+'" onclick="go('+i+')"><span class="icon">'+m[2]+'</span> '+m[0]+'<br><small>'+(53001+i)+' · ScreenType '+m[1]+'</small></button>').join('');if(personal){portal();return}const m=menus[page];$('#main').innerHTML='<section class="card caption row"><span class="icon">'+m[2]+'</span><h1 class="grow">'+m[0]+'</h1><button id="favorite" aria-label="เมนูลัด">'+(favorites.has(page)?'★':'☆')+'</button><button id="view" class="toggleView" aria-label="สลับ List/Card">▦</button></section><div id="content"></div>';$('#favorite').onclick=()=>{favorites.has(page)?favorites.delete(page):favorites.add(page);render()};$('#view').onclick=()=>{cardView=!cardView;render()};[settings,shopList,shopItems,commissions,identifiers,stock,wallet,pos,history,purchases,settlement,dashboard][page]()}
function shopSelect(){return '<label>ร้านค้า<select id="shopSelect" '+(role==='shop'?'disabled':'')+'>'+shops.map(s=>'<option value="'+s.id+'" '+(s.id===shop?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label>'}
function bindShop(){if($('#shopSelect'))$('#shopSelect').onchange=e=>{shop=+e.target.value;cart={};render()}}
function field(label,name,value='',type='text'){return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" required></label>'}
function openForm(title,body,save){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;saveDialog=save;$('#dialog').showModal()}
$('#cancel').onclick=()=>$('#dialog').close();$('#dialogForm').onsubmit=e=>{e.preventDefault();if(e.target.reportValidity())saveDialog(new FormData(e.target))};
function listing(headers,rows,action){const filtered=rows.filter(r=>r.join(' ').toLowerCase().includes(search.toLowerCase())),size=5;index=Math.min(index,Math.max(0,Math.ceil(filtered.length/size)-1));const part=filtered.slice(index*size,(index+1)*size);let html='<form id="filter" class="card row"><input class="grow" aria-label="ค้นหารายการ" placeholder="ค้นหารหัสหรือชื่อ" value="'+esc(search)+'"><button class="primary">ค้นหา</button><button type="button" id="clear">ล้าง Filter</button></form><div class="'+(cardView?'cards':'')+'"><section class="card tablewrap"><table><thead><tr><th>ID</th><th>Action</th>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+part.map((r,i)=>'<tr><td>'+(index*size+i+1)+'</td><td>'+(action?action(r):'—')+'</td>'+r.slice(1).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(part.length?'':'<p class="empty">ไม่พบรายการ ทดลองขายหรือเปลี่ยนคำค้น</p>')+'</section><section class="records">'+part.map(r=>'<article class="record">'+headers.map((h,i)=>'<p><small>'+h+'</small><br>'+esc(r[i+1])+'</p>').join('')+(action?action(r):'')+'</article>').join('')+'</section></div><section class="card pagination row"><button id="prev" '+(index===0?'disabled':'')+'>‹</button><button class="primary">'+(index+1)+'</button><button id="next" '+((index+1)*size>=filtered.length?'disabled':'')+'>›</button><span>'+(filtered.length?index*size+1:0)+'-'+Math.min((index+1)*size,filtered.length)+' จาก '+filtered.length+'</span></section>';$('#content').innerHTML+=html;$('#filter').onsubmit=e=>{e.preventDefault();search=e.target.querySelector('input').value;index=0;render()};$('#clear').onclick=()=>{search='';render()};$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()}}
function settings(){$('#content').innerHTML='<section class="card"><form id="settings" class="form"><label class="row"><input name="enabled" type="checkbox" '+(enabled?'checked':'')+'> หักเปอร์เซ็นต์ยอดขาย</label><div class="fields">'+field('อัตราเริ่มต้น (%)','rate',rate,'number')+field('เวลา Alert (วินาที) — จำลองส่วนกลาง','seconds',seconds,'number')+'</div><p class="notice">Wallet · Online เท่านั้น · เชื่อม LAOO_SCHOOL · ห้ามยอดติดลบ</p><div class="actions"><button class="primary">▣ บันทึก</button></div></form></section>';$('#settings').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=+f.get('rate'),s=+f.get('seconds');if(v<0||v>100||s<1)return notify('ค่าไม่ถูกต้อง','อัตรา 0–100 และเวลาอย่างน้อย 1 วินาที');enabled=f.has('enabled');rate=v;seconds=s;notify('บันทึกค่าจำลองแล้ว')}}
function shopList(){$('#content').innerHTML='<section class="card row spread"><p>ร้านค้าและการเก็บสต๊อก</p><button class="primary" onclick="editShop()">＋ เพิ่มร้านค้า</button></section>';listing(['ร้านค้า','เก็บสต๊อก','สถานะ'],shops.map(s=>[s.id,s.name,s.stock?'เก็บ':'ไม่เก็บ','ใช้งาน']),r=>'<button onclick="editShop('+r[0]+')">✎ แก้ไข</button>')}
function editShop(id){const s=shops.find(s=>s.id===id);openForm('ข้อมูลร้านค้า > '+(s?'แก้ไข':'เพิ่ม'),'<label class="row"><input type="checkbox" checked disabled> สถานะใช้งาน</label>'+field('ชื่อร้านค้า *','name',s?.name||'')+'<label class="row"><input name="stock" type="checkbox" '+(s?.stock?'checked':'')+'> เก็บสต๊อก</label><label>คลังร้าน<select><option>คลังโรงอาหาร</option><option>คลังเครื่องดื่ม</option></select></label>',f=>{if(s){s.name=f.get('name');s.stock=f.has('stock');$('#dialog').close()}else{const id=shops.length+1;shops.push({id,name:f.get('name'),stock:f.has('stock')});assigned[id]=new Set();$('#dialogForm').reset()}render();notify('บันทึกร้านค้าจำลองแล้ว')})}
function shopItems(){$('#content').innerHTML='<section class="card">'+shopSelect()+'<p class="muted">เลือกสินค้าจากส่วนกลางสำหรับร้านนี้</p></section><form id="items" class="card form">'+products.map(p=>'<div class="row"><label class="row grow"><input name="item'+p.id+'" type="checkbox" '+(assigned[shop].has(p.id)?'checked':'')+'> '+p.name+'</label><span>฿'+money(p.price)+'</span></div>').join('')+'<div class="actions"><button class="primary">▣ บันทึก</button></div></form>';bindShop();$('#items').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);assigned[shop]=new Set(products.filter(p=>f.has('item'+p.id)).map(p=>p.id));notify('บันทึกสินค้าร้านจำลองแล้ว')}}
function commissions(){$('#content').innerHTML='<section class="card"><p class="notice">สินค้า → ประเภทสินค้า → ร้านค้า → ค่าเริ่มต้น ใช้อัตราที่เฉพาะที่สุดเพียงอัตราเดียว</p><form id="commission" class="form">'+shopSelect()+'<div class="fields"><label>ระดับอัตรา<select><option>ร้านค้า</option><option>ประเภทสินค้า</option><option>สินค้า</option></select></label>'+field('อัตราหัก (%)','rate',rate,'number')+'</div><small>ตัวอย่าง Layout: Draft ใช้อัตราร่วมเดียว ระบบจริงกำหนดได้ครบทุกระดับ</small><div class="actions"><button class="primary">▣ บันทึก</button></div></form></section>';bindShop();$('#commission').onsubmit=e=>{e.preventDefault();const v=+new FormData(e.target).get('rate');if(v<0||v>100)return notify('อัตราไม่ถูกต้อง','ระบุ 0–100');rate=v;notify('บันทึกอัตราจำลองแล้ว')}}
function identifiers(){$('#content').innerHTML='<section class="card"><p>บัตรตัวอย่าง · ไม่มีการเก็บลายนิ้วมือดิบ</p><button onclick="notify(\'Fingerprint Simulator\',\'ยังไม่ได้เชื่อมเครื่องจริง ต้องทดสอบ SDK ตามรุ่นก่อนใช้งาน\')">ทดลอง Adapter</button></section>';listing(['บัตร','นักเรียน','สถานะ'],cardsData.map((c,i)=>[i,c.code,students.find(s=>s.id===c.student).name,c.active?'ใช้งาน':'ระงับ']),r=>'<button onclick="cardsData['+r[0]+'].active=!cardsData['+r[0]+'].active;render()">เปลี่ยนสถานะ</button>')}
function stock(){$('#content').innerHTML='<section class="card"><h2>SF-TR-001 · คลังโรงเรียน → ครัวอิ่มอร่อย</h2><p class="muted">เอกสารตัวอย่างสำหรับทดลองยืนยันรับ</p></section>';listing(['สินค้า','จำนวน','สถานะ'],[[1,'ข้าวไก่กระเทียม',10,received?'รับแล้ว':'รอรับ']],()=>'<button '+(received?'disabled':'')+' onclick="receive()">ยืนยันรับ</button>')}
function receive(){if(!online)return notify('รับสินค้าไม่ได้','เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่');if(received)return;received=true;products[0].stock+=10;render();notify('รับสต๊อกจำลองแล้ว')}
function wallet(){listing(['รหัสนักเรียน','ชื่อ','ชั้นเรียน','ยอด Wallet'],students.map(s=>[s.id,s.code,s.name,s.room,money(s.balance)]),r=>'<button onclick="topup('+r[0]+')">＋ เติมเงิน</button>')}
function topup(id){const s=students.find(s=>s.id===id);openForm('Wallet > เติมเงิน','<div class="notice">'+s.name+' · '+s.room+'<br>คงเหลือ ฿'+money(s.balance)+'</div>'+field('ยอดเติม *','amount',100,'number')+field('เลขอ้างอิง *','reference','RC-DEMO-001')+'<label>รับเงิน<select><option>เงินสด</option><option>โอนเงิน</option></select></label>',f=>{const amount=+f.get('amount');if(!online||amount<=0)return notify('เติมเงินไม่ได้','ต้อง Online และระบุยอดมากกว่า 0');s.balance+=amount;$('#dialog').close();render();notify('เติมเงินจำลองสำเร็จ')})}
function pos(){$('#content').innerHTML='<div class="pos"><section class="card"><div class="fields">'+shopSelect()+'<label>บัตรนักเรียน<input id="card" placeholder="CARD-660214 หรือ CARD-660229" autocomplete="off"></label></div><div class="row" style="margin-top:10px"><button id="scan">▣ อ่านบัตรตัวอย่าง</button><button id="low">ทดลองยอดไม่พอ</button><button id="finger">ลายนิ้วมือจำลอง</button></div>'+(student?'<div class="identity row"><div class="grow"><strong>'+student.name+'</strong><p>'+student.code+' · '+student.room+'</p><small>ยืนยันตัวตนแล้ว</small></div><div><small>ยอดคงเหลือ</small><div class="money">฿'+money(student.balance)+'</div></div></div>':'<p class="notice">ระบุตัวนักเรียนก่อนยืนยันขาย · ตัวอย่างบัตร 660214</p>')+'<div class="row spread"><h2>เลือกสินค้า</h2><small>'+(shopNow().stock?'ตัดสต๊อก':'ไม่เก็บสต๊อก')+'</small></div><div class="products">'+products.filter(p=>assigned[shop].has(p.id)).map(p=>'<button class="product" onclick="add('+p.id+')"><span class="art">พื้นที่ภาพสินค้า</span><strong>'+p.name+'</strong><span class="row spread"><span class="price">฿'+p.price+'</span><small>'+(shopNow().stock?'เหลือ '+p.stock:'พร้อมขาย')+'</small></span></button>').join('')+'</div></section><aside class="card basket"><div class="row spread"><h2>ตะกร้าของนักเรียน</h2><button onclick="cart={};render()">ล้าง</button></div>'+Object.entries(cart).map(([id,q])=>{const p=products.find(p=>p.id===+id);return '<div class="line"><strong>'+p.name+'</strong><div class="row"><button aria-label="ลดจำนวน" onclick="adjust('+id+',-1)">−</button><span>'+q+'</span><button aria-label="เพิ่มจำนวน" onclick="add('+id+')">＋</button><span class="grow"></span><strong>฿'+money(q*p.price)+'</strong></div></div>'}).join('')+(!total()?'<p class="empty">แตะสินค้าเพื่อเพิ่ม<br>รายการจะแสดงที่นี่</p>':'')+'<div class="row spread line"><span>ยอดชำระ</span><strong class="money">฿'+money(total())+'</strong></div><p class="muted">'+(student?'คงเหลือหลังชำระ ฿'+money(student.balance-total()):'กรุณาระบุตัวนักเรียน')+'</p><button class="primary full" id="pay" '+(!online||!student||!total()?'disabled':'')+'>ยืนยันขาย · หัก Wallet</button>'+(!online?'<p class="error">Offline — หยุดรับชำระจนกว่าจะเชื่อมต่อ</p>':'')+'</aside></div>';bindShop();$('#scan').onclick=()=>identify('CARD-660214');$('#low').onclick=()=>identify('CARD-660229');$('#finger').onclick=()=>{identify('CARD-660214');notify('Fingerprint Simulator — ไม่ได้อ่านนิ้วจริง')};$('#card').onkeydown=e=>{if(e.key==='Enter')identify(e.target.value)};$('#pay').onclick=pay}
function identify(value){const c=cardsData.find(c=>c.code===value.trim());if(!c||!c.active){student=null;render();return notify('ใช้บัตรไม่ได้','ไม่พบบัตรหรือถูกระงับ ติดต่อโรงเรียน')}student=students.find(s=>s.id===c.student);render()}
function add(id){const p=products.find(p=>p.id===id);if(shopNow().stock&&(cart[id]||0)>=p.stock)return notify('สต๊อกไม่เพียงพอ','ลดจำนวนหรือเลือกสินค้าอื่น');cart[id]=(cart[id]||0)+1;render()}function adjust(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];render()}
function pay(){if(!online||!student||!total())return;if(total()>student.balance)return notify('ยอด Wallet ไม่เพียงพอ','ให้โรงเรียนเติมเงินหรือลดรายการสินค้า');const amount=total(),lines=Object.entries(cart).map(([id,qty])=>({item:+id,qty,returned:0,price:products.find(p=>p.id===+id).price}));student.balance-=amount;lines.forEach(l=>{if(shopNow().stock)products.find(p=>p.id===l.item).stock-=l.qty});sales.unshift({id:sales.length+1,student:student.id,shop,amount,refund:0,rate:enabled?rate:0,tracked:shopNow().stock,lines});cart={};student=null;render();notify('ขายจำลองสำเร็จ ฿'+money(amount))}
const visibleSales=()=>sales.filter(s=>role!=='shop'||s.shop===1);
function history(){listing(['เลขที่','นักเรียน','ร้านค้า','ยอดสุทธิ','สถานะ'],visibleSales().map(s=>[s.id,'SF-DEMO-'+s.id,students.find(x=>x.id===s.student).name,shops.find(x=>x.id===s.shop).name,money(s.amount-s.refund),s.refund===s.amount?'คืนครบ':s.refund?'คืนบางส่วน':'ขายสำเร็จ']),r=>'<button onclick="refund('+r[0]+')">คืนสินค้า</button>')}
function refund(id){const s=sales.find(x=>x.id===id),lines=s.lines.filter(l=>l.returned<l.qty);if(!lines.length)return notify('คืนครบแล้ว');openForm('ประวัติขาย > คืนบางส่วน','<p>SF-DEMO-'+id+'</p><label>สินค้า<select name="item">'+lines.map(l=>'<option value="'+l.item+'">'+products.find(p=>p.id===l.item).name+' · คืนได้ '+(l.qty-l.returned)+'</option>').join('')+'</select></label>'+field('จำนวนคืน *','qty',1,'number')+field('เหตุผล *','reason','ขายผิดรายการ'),f=>{const l=s.lines.find(l=>l.item===+f.get('item')),qty=+f.get('qty');if(!online||!Number.isInteger(qty)||qty<=0||qty>l.qty-l.returned)return notify('คืนสินค้าไม่ได้','ต้อง Online และจำนวนไม่เกินที่ซื้อ');l.returned+=qty;const amount=qty*l.price;s.refund+=amount;students.find(x=>x.id===s.student).balance+=amount;if(s.tracked)products.find(p=>p.id===l.item).stock+=qty;$('#dialog').close();render();notify('คืน Wallet จำลอง ฿'+money(amount))})}
function purchases(){listing(['นักเรียน','ชั้นเรียน','จำนวนใบขาย','ยอดซื้อสุทธิ'],students.map(s=>[s.id,s.name,s.room,sales.filter(x=>x.student===s.id).length,money(sales.filter(x=>x.student===s.id).reduce((a,x)=>a+x.amount-x.refund,0))]))}
function settlement(){listing(['ร้านค้า','ยอดขายสุทธิ','ยอดหัก','สุทธิให้ร้าน'],shops.filter(s=>role!=='shop'||s.id===1).map(shop=>{const ss=sales.filter(s=>s.shop===shop.id),net=ss.reduce((a,s)=>a+s.amount-s.refund,0),cut=ss.reduce((a,s)=>a+(s.amount-s.refund)*s.rate/100,0);return[shop.id,shop.name,money(net),money(cut),money(net-cut)]}));$('#content').insertAdjacentHTML('afterbegin','<p class="card notice">ยอดจำลองสำหรับเทียบใบขายและคืนสินค้า ยังไม่มีการจ่ายเงินจริง</p>')}
function dashboard(){const ss=visibleSales(),net=ss.reduce((a,s)=>a+s.amount-s.refund,0);$('#content').innerHTML='<section class="card fields"><label>ช่วงเวลา<select><option>วันนี้</option><option>เดือนนี้</option><option>ปีนี้</option></select></label><label>มิติรายงาน<select id="dimension"><option>ร้านค้า</option><option>ประเภทสินค้า</option><option>สินค้า</option><option>ระดับชั้น</option><option>นักเรียน</option></select></label></section><section class="stats"><article class="card stat">ยอดสุทธิ<strong>฿'+money(net)+'</strong></article><article class="card stat">ใบขาย<strong>'+ss.length+'</strong></article><article class="card stat">ยอดคืน<strong>฿'+money(ss.reduce((a,s)=>a+s.refund,0))+'</strong></article></section><section class="card"><h2>สัดส่วนยอดขาย</h2><div id="bars"></div><small>ข้อมูลทดลองรอบนี้ ตัวเลือกวัน/เดือน/ปีเป็นตัวอย่าง Layout</small></section>';function bars(){const groups={};ss.forEach(s=>s.lines.forEach(l=>{const p=products.find(p=>p.id===l.item),st=students.find(x=>x.id===s.student),dim=$('#dimension').value,key=dim==='ร้านค้า'?shops.find(x=>x.id===s.shop).name:dim==='ประเภทสินค้า'?p.type:dim==='สินค้า'?p.name:dim==='ระดับชั้น'?st.room.split('/')[0]:st.name;groups[key]=(groups[key]||0)+(l.qty-l.returned)*l.price}));$('#bars').innerHTML=Object.entries(groups).map(([k,v])=>'<div class="line row"><span class="grow">'+esc(k)+'</span><strong>'+money(v)+' บาท · '+(net?(v/net*100).toFixed(1):0)+'%</strong></div>').join('')||'<p class="empty">ทดลองขายก่อนเพื่อดูสถิติ</p>'}$('#dimension').onchange=bars;bars()}
function portal(){const s=students[0],ss=sales.filter(x=>x.student===s.id);$('#main').innerHTML='<section class="card caption row"><span class="icon">◷</span><h1>'+(role==='guardian'?'การซื้อของบุตร':'การซื้อของฉัน')+'</h1></section><section class="card identity row"><div class="grow"><h2>'+s.name+'</h2><p>'+s.code+' · '+s.room+'</p></div><div><small>ยอด Wallet</small><div class="money">฿'+money(s.balance)+'</div></div></section><section class="card"><h2>วันนี้ซื้ออะไรบ้าง</h2>'+ss.map(x=>'<article class="line"><div class="row spread"><strong>'+esc(shops.find(y=>y.id===x.shop).name)+'</strong><strong>฿'+money(x.amount-x.refund)+'</strong></div><p>'+x.lines.map(l=>products.find(p=>p.id===l.item).name+' × '+(l.qty-l.returned)).join(' · ')+'</p><small>SF-DEMO-'+x.id+(x.refund?' · มีการคืนสินค้า':'')+'</small></article>').join('')+(!ss.length?'<p class="empty">ยังไม่มีรายการ ลองขายด้วยบัตร 660214 ก่อน</p>':'')+'</section><section class="card"><h2>ข้อมูลโรงเรียนที่เชื่อมต่อ</h2><p>เข้าเรียน 07:42 · ม.3/2 · ข่าวสารถึงผู้ปกครอง</p><small>ตัวอย่าง Portal ข้อมูลไม่ได้อ่านจากฐานจริง</small></section>'}
$('#role').onchange=e=>{role=e.target.value;shop=1;cart={};student=null;page=7;search='';index=0;render()};$('#theme').onchange=e=>{document.documentElement.style.setProperty('--p',e.target.value==='green'?'#118363':'#265cb0');document.documentElement.style.setProperty('--soft',e.target.value==='green'?'#e8f4ef':'#edf2fb')};$('#network').onclick=()=>{online=!online;$('#network').textContent=online?'● Online':'○ Offline';render()};$('#menu').onclick=()=>$('#nav').classList.toggle('open');render();
// Keep the basket reachable with one touch on a phone.
const originalRender=render;
render=function(){originalRender();document.getElementById('mobileCart')?.remove();if(page===7&&['school','shop'].includes(role)){const dock=document.createElement('div');dock.id='mobileCart';dock.className='mobile-cart row';dock.innerHTML='<strong class="grow">รวม ฿'+money(total())+'</strong><button class="primary">ดูตะกร้า / ชำระ</button>';dock.querySelector('button').onclick=()=>document.querySelector('.basket').scrollIntoView({behavior:'smooth',block:'start'});document.body.appendChild(dock)}};
render();
</script>
<style>
.mobile-cart{display:none}
@media(max-width:899px){body{padding-bottom:76px}.mobile-cart{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px;background:white;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}.mobile-cart strong{font-size:20px;color:var(--p)}.records:empty:after{content:'ไม่พบรายการ ทดลองขายหรือเปลี่ยนคำค้น';display:block;padding:24px;background:white;color:var(--muted)}}
</style></body></html>
