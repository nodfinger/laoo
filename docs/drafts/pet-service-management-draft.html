<!doctype html><html lang=th><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>LAOO PET — Draft</title><style>
@font-face{font-family:noto;src:url('../../assets/fonts/NotoSansThai-Variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#20332a;font:14px noto,Tahoma;--p:#087f67;--t:#e9f5f1;--b:#dce6e1}body.rose{--p:#b54c79;--t:#faeaf0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p)}header{height:52px;background:white;border-bottom:1px solid var(--b);padding:0 16px;display:flex;align-items:center;justify-content:space-between}header strong{color:var(--p)}.shell{display:grid;grid-template-columns:220px minmax(0,1fr)}aside{background:white;padding:10px;min-height:calc(100vh - 52px)}main{padding:10px;min-width:0}.nav{display:block;width:100%;border:0;background:white;text-align:left;padding:10px;border-radius:4px}.nav.active,.nav:hover{background:var(--t);color:var(--p)}.card{background:white;padding:10px;border-radius:4px;margin-bottom:6px}.caption{display:flex;align-items:center;gap:8px;min-height:54px}.caption h1{font-size:18px;color:black;margin:0}.icon,.star{font-size:22px;color:var(--p)}.star{border:0;background:none}.grow{flex:1}.btn{height:48px;padding:0 14px;border:1px solid var(--p);border-radius:4px;background:white;color:var(--p);font-size:13px;font-weight:700}.btn.fill{background:var(--p);color:white}.filter{display:flex;flex-wrap:wrap;gap:8px}.field{height:40px;border:1px solid var(--b);border-radius:4px;padding:0 10px;background:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.item{padding:14px}.item h2{font-size:16px}.item footer{border-top:1px solid var(--b);padding-top:10px;display:flex;justify-content:space-between}.tag{background:var(--t);color:var(--p);padding:3px 8px;border-radius:4px;font-size:12px}.note{font-size:12px;color:#66766d}.page{height:56px;display:flex;align-items:center;gap:6px}.page button{width:34px;height:34px;border:1px solid var(--p);border-radius:4px;background:white;color:var(--p)}.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.room{min-height:100px;border:1px solid var(--b);padding:10px;border-radius:4px}.mobile{display:none}
</style></head><body><header><strong>▣ LAOO PET · ดูแลสัตว์เลี้ยง</strong><label>ธีม <select id=theme><option>เขียว</option><option>ชมพู</option></select></label></header><div class=mobile><select class=field id=mobileMenu></select></div><div class=shell><aside><p class=note>เมนูระบบสัตว์เลี้ยง</p><div id=nav></div></aside><main><div id=view></div><p class=note>Draft ข้อมูลตัวอย่าง · ไม่เชื่อม API หรือฐานข้อมูล</p></main></div><script>
document.head.insertAdjacentHTML('beforeend',`<style>.backdrop{display:none;position:fixed;inset:0;background:#0008;padding:24px;align-items:center;justify-content:center}.backdrop.open{display:flex}.dialog{width:min(480px,100%);max-height:calc(100vh - 48px);background:white;border-radius:4px;display:flex;flex-direction:column}.dialog header,.dialog footer{height:auto;min-height:48px;padding:10px}.dialog footer{display:flex;justify-content:flex-end;gap:8px}.form{padding:10px;overflow:auto;display:grid;gap:16px}.form label{display:grid;gap:5px;color:var(--p)}.form input{height:48px;border:1px solid var(--b);border-radius:4px;padding:10px}@media(max-width:899px){.shell{display:block}aside{display:none}.mobile{display:block;background:white;padding:8px}.mobile select{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.rooms{grid-template-columns:repeat(3,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.rooms{grid-template-columns:repeat(2,1fr)}.caption{flex-wrap:wrap}.caption .grow{display:none}.caption .btn{margin-left:auto}}</style>`);
document.body.insertAdjacentHTML('beforeend',`<div id='modal' class='backdrop'><div class='dialog' role='dialog' aria-modal='true'><header id='modalTitle'></header><div id='modalBody' class='form'></div><footer><button id='cancel' class='btn'>ยกเลิก</button><button id='save' class='btn fill'>บันทึก</button></footer></div></div>`);
const menus=[['62001','ตั้งค่าระบบสัตว์เลี้ยง'],['62002','ประเภทบริการ'],['62003','ห้องและกรง'],['62004','โปรไฟล์สัตว์เลี้ยง'],['62005','แพ็กเกจและสมาชิก'],['62006','นัดหมาย'],['62007','เช็กอินและงานบริการ'],['62008','ประวัติบริการ'],['62009','พอร์ทัลเจ้าของสัตว์'],['62010','Dashboard และรายงาน']];let current='62006';
const $=s=>document.querySelector(s),button=(s,a)=>`<button class='btn' data-action='${a}'>${s}</button>`;let favorite=false;
function caption(){let m=menus.find(x=>x[0]===current);return `<div class='card caption'><span class='icon'>♧</span><h1>${m[1]}</h1><button class='star' data-action='favorite'>${favorite?'★':'☆'}</button><span class='grow'></span>${button('＋ เพิ่ม','add')}</div>`}
function list(rows){return caption()+`<div class='card filter'><input class='field' placeholder='ค้นหาชื่อหรือรหัส'>${button('ค้นหา','search')}${button('ล้าง Filter','clear')}</div><div class='grid'>${rows.map(r=>`<article class='card item'><span class='tag'>${r[0]}</span><h2>${r[1]}</h2><p>${r[2]}</p>${button('ดูรายละเอียด','detail')}</article>`).join('')}</div><div class='card page'><button>&lt;</button><button>1</button><button>&gt;</button><span class='note'>1-5 จาก 5</span></div>`}
const pets=[['PET-001','โมจิ · ชิบะอินุ','เจ้าของคุณพิม · 3 ปี'],['PET-002','มะลิ · แมวเปอร์เซีย','เจ้าของคุณภัทร · แพ้อาหารทะเล'],['PET-003','คุกกี้ · ปอมเมอเรเนียน','เจ้าของคุณอร']],appointments=[['BK-001','โมจิ · โรงแรม 2 คืน + อาบน้ำ','12–14 ต.ค. · ห้อง H-02'],['BK-002','มะลิ · อาบน้ำตัดขน','13 ต.ค. 10:00'],['BK-003','คุกกี้ · รับส่ง + อาบน้ำ','13 ต.ค. 13:00']];
function roomPage(){return caption()+`<div class='card'><h2>ห้องและกรง · 13 ตุลาคม</h2><p class='note'>สีมีข้อความสถานะกำกับเสมอ</p><div class='rooms'>${[['H-01','ว่าง'],['H-02','มีผู้เข้าพัก · โมจิ'],['H-03','จองแล้ว'],['H-04','ว่าง'],['D-01','กำลังดูแล'],['D-02','ปิดใช้']].map(x=>`<div class='room'><strong>${x[0]}</strong><p class='tag'>${x[1]}</p></div>`).join('')}</div></div>`}
function portal(){return caption()+`<div class='card' style='max-width:430px;margin:auto'><p class='note'>พอร์ทัลตัวอย่าง · คุณพิม</p><h2>ดูแลโมจิวันนี้</h2><div style='height:90px;background:var(--t);display:grid;place-items:center;font-size:40px;color:var(--p)'>♧</div><h3>โมจิ · ชิบะอินุ</h3><p>กำลังเข้าพัก · ห้อง H-02 · 12–14 ตุลาคม</p><p>09:20 เช็กอินแล้ว</p><p>12:00 รับประทานอาหาร · มีรูป</p>${button('จองบริการใหม่','add')}</div>`}
function page(){switch(current){case '62001':return caption()+`<div class='card'><h2>กติกาการให้บริการ</h2><p>แจ้งเตือนก่อนนัดหมาย: 1 วัน</p><p>เวลาเช็กอิน: 09:00–18:00</p><p>รับเกินความจุ: ไม่อนุญาต</p></div>`;case '62002':return list([['SV-01','โรงแรมสัตว์เลี้ยง','คิดตามคืน'],['SV-02','อาบน้ำตัดขน','คิดตามขนาด'],['SV-03','ฝากเลี้ยงรายวัน','ต้องเลือกห้อง'],['SV-04','รับส่งสัตว์เลี้ยง','กำหนดจุดรับ/ส่ง']]);case '62003':return roomPage();case '62004':return list(pets);case '62005':return list([['PK-01','อาบน้ำ 5 ครั้ง','คงเหลือ 3 ครั้ง'],['PK-02','โรงแรม 10 คืน','คงเหลือ 8 คืน'],['MB-01','สมาชิก Silver','หมดอายุ 31 ธ.ค.']]);case '62006':return list(appointments);case '62007':return caption()+list(appointments)+`<div class='card'><h2>งานของโมจิวันนี้</h2><p>09:20 เช็กอิน · ถ่ายรูป</p><p>12:00 ให้อาหาร · รูปประกอบ</p><p>16:00 พาเดิน · รอดำเนินการ</p></div>`;case '62008':return list([['H-01','โมจิ · โรงแรม','10–12 ก.ย. · มีรูป'],['H-02','มะลิ · อาบน้ำตัดขน','4 ก.ย. · ใช้แพ็กเกจ']]);case '62009':return portal();default:return caption()+`<div class='grid'>${[['นัดหมาย','24'],['เข้าพักอยู่','8 / 12'],['บริการเสร็จ','19'],['สิทธิ์ใช้แล้ว','32']].map(x=>`<div class='card item'><p>${x[0]}</p><h2>${x[1]}</h2></div>`).join('')}</div><div class='card'>บริการยอดนิยม: อาบน้ำตัดขน · ฝากเลี้ยง · รับส่ง</div>`}}
function draw(){$('#nav').innerHTML=menus.map(m=>`<button class='nav ${m[0]===current?'active':''}' data-menu='${m[0]}'>${m[1]}</button>`).join('');$('#mobileMenu').innerHTML=menus.map(m=>`<option value='${m[0]}' ${m[0]===current?'selected':''}>${m[1]}</option>`).join('');$('#view').innerHTML=page()}
function dialog(action){let m=menus.find(x=>x[0]===current);$('#modalTitle').textContent=m[1]+' > '+(action==='detail'?'ดูข้อมูล':'เพิ่ม');let fields=current==='62004'?['ชื่อสัตว์ *','เจ้าของ *','ชนิด/พันธุ์','ข้อควรระวัง']:current==='62006'?['เจ้าของ *','สัตว์เลี้ยง *','บริการ (เลือกหลายรายการ) *','วันและเวลา *','ห้อง/กรง']:['ชื่อรายการ *','รายละเอียด'];$('#modalBody').innerHTML=fields.map(x=>`<label>${x}<input placeholder='${x}' ${action==='detail'?'readonly':''}></label>`).join('');$('#save').style.display=action==='detail'?'none':'';$('#modal').classList.add('open')}
document.addEventListener('click',e=>{let m=e.target.closest('[data-menu]');if(m){current=m.dataset.menu;draw();return}let a=e.target.closest('[data-action]')?.dataset.action;if(a==='favorite'){favorite=!favorite;draw()}else if(a==='add'||a==='detail')dialog(a);else if(a==='clear')document.querySelectorAll('#view input').forEach(x=>x.value='')});$('#mobileMenu').onchange=e=>{current=e.target.value;draw()};$('#theme').onchange=e=>document.body.classList.toggle('rose',e.target.value==='ชมพู');$('#cancel').onclick=$('#save').onclick=()=>$('#modal').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});draw();
</script></body></html>
