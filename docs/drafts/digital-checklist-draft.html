<!doctype html>
<html lang=th><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>LAOO Digital Checklist · Draft</title>
<style>
@font-face{font-family:Noto;src:url('../../assets/fonts/NotoSansThai-Variable.ttf')}
:root{--p:#087d68;--s:#e8f4ef;--bg:#f5f7f8;--b:#dfe6e2;--m:#68766f;--warn:#fff5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Noto,Tahoma,Arial;color:#18231f}button,input,select,textarea{font:inherit}button{min-height:40px;padding:7px 10px;border:1px solid var(--b);border-radius:4px;background:#fff;color:var(--p);font-size:13px;font-weight:700;cursor:pointer}button:hover,.active{background:var(--s)}.primary{background:var(--p);color:#fff;border-color:var(--p)}h1,h2,h3,p{margin:0}h1{font-size:18px;color:#111}h2{font-size:16px}small{font-size:12px;color:var(--m)}.grow{flex:1}.draft{padding:5px 10px;background:#e8efec;display:flex;gap:9px;align-items:center;font-size:12px}.draft strong,.ico{color:var(--p)}.draft select{width:auto;height:30px}.top{height:56px;background:white;display:flex;gap:9px;align-items:center;padding:0 12px;border-bottom:1px solid var(--b)}.brand{color:var(--p);font-weight:800}.mark{padding:5px 8px;background:var(--p);color:white;border-radius:4px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 96px)}nav{background:#fff;padding:9px;border-right:1px solid var(--b)}nav button{display:block;width:100%;border:0;text-align:left;margin:2px 0}main{padding:10px;min-width:0}.sec{background:#fff;border-radius:4px;margin-bottom:6px;padding:10px}.caption,.cap,.tools{display:flex;align-items:center;gap:8px}.caption{min-height:58px}.tools{margin-left:auto}.star{border:0;font-size:20px}.filters{display:flex;gap:8px;flex-wrap:wrap}label{display:grid;gap:4px}input,select,textarea{height:40px;border:1px solid var(--b);border-radius:4px;padding:7px}.tbl{width:100%;min-width:620px;border-collapse:collapse}.scroll{overflow:auto}.tbl th,.tbl td{padding:9px;border-bottom:1px solid var(--b);text-align:left}.tbl th{color:var(--p);background:var(--s)}.cards{display:none}.pager{height:56px;display:flex;align-items:center;gap:6px}.pager button{width:34px;min-height:34px;padding:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.metric strong{display:block;font-size:24px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:6px}.line{padding:9px 0;border-bottom:1px solid var(--b)}.dept{padding:11px;background:var(--s);border-radius:4px}.route{display:flex;gap:7px;flex-wrap:wrap}.route span{padding:7px;border:1px solid var(--b);border-radius:4px}.pill{padding:3px 8px;background:var(--s);border-radius:4px;color:var(--p);font-size:12px}.toast{position:fixed;right:12px;top:100px;background:color-mix(in srgb,var(--p) 50%,transparent);color:#fff;padding:11px;border-radius:4px}.toast[hidden]{display:none}dialog{width:min(480px,calc(100vw - 48px));max-height:calc(100vh - 48px);border:0;border-radius:4px;padding:0}.form{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}.form h2,.form footer{padding:10px;border-bottom:1px solid var(--b)}.formbody{padding:12px;display:grid;gap:16px;overflow:auto}.form footer{border:0;border-top:1px solid var(--b);display:flex;justify-content:flex-end;gap:8px}
@media(max-width:899px){.shell{display:block}nav{display:none}nav.open{display:grid;grid-template-columns:1fr 1fr}.hamb{display:block}.scroll{display:none}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.record{padding:10px;background:#fff;border-bottom:1px solid var(--b)}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.draft .hint,.topmeta{display:none}.top{height:56px}.hamb{display:block}main{padding:8px}.caption{flex-wrap:wrap}.cap{flex:1}.tools{width:100%;justify-content:flex-end}.filters,label{width:100%}.cards{grid-template-columns:1fr}}
</style></head><body>
<div class=draft><strong>Draft UX · LAOO_DIGITAL_CHECKLIST</strong><span class=hint>ข้อมูลจำลอง · API ยังไม่เชื่อม</span><span class=grow></span><label>ธีม<select id=theme><option>เขียว</option><option>น้ำเงิน</option></select></label><label>สิทธิ์<select id=role><option>พนักงาน IT</option><option>ผู้ดูแลบริษัท</option><option>Audit</option></select></label></div>
<header class=top><button id=hamb class=hamb>☰</button><span class=brand><span class=mark>✓</span> LAOO / CHECKLIST</span><span class=grow></span><span>กิตติ · ฝ่ายเทคโนโลยีสารสนเทศ</span></header><div class=shell><nav id=nav></nav><main id=main></main></div>
<dialog id=dlg><form id=form class=form><h2 id=dt></h2><div id=db class=formbody></div><footer><button type=button id=cancel>ยกเลิก</button><button class=primary>▣ บันทึก</button></footer></form></dialog><div id=toast class=toast hidden></div>
<script>
const M=[['58001','ตั้งค่าระบบ','⚙'],['58002','กลุ่มและประเภทตรวจ','▦'],['58003','แบบตรวจ','☷'],['58004','สายอนุมัติ','⇢'],['58005','รอบตรวจและผู้รับผิดชอบ','◷'],['58006','งานตรวจของฉัน','✓'],['58007','งานรออนุมัติ','⌁'],['58008','งานแก้ไขและแจ้งซ่อม','⚒'],['58009','Audit และประวัติ','◫'],['58010','Dashboard และรายงาน','▥']];
const D={'58002':[['01','IT','กล้อง CCTV','ฝ่าย IT','2 ประเภท','ใช้งาน'],['02','IT','สำรองข้อมูล','ฝ่าย IT','1 ประเภท','ใช้งาน'],['03','อาคาร','ระบบปรับอากาศ','ฝ่ายอาคาร','3 ประเภท','ใช้งาน']],'58003':[['01','กล้อง CCTV · ห้องควบคุม','ตรวจภาพ / NVR / เวลา','IT','12 ข้อ','เผยแพร่'],['02','สำรองข้อมูล · ERP','ตรวจสำรองและกู้คืน','IT','8 ข้อ','เผยแพร่']],'58004':[['01','อนุมัติแบบตรวจ IT','หัวหน้าฝ่าย → ผู้จัดการ','ทุกผลตรวจ','2 ขั้น','ใช้งาน']],'58005':[['01','CCTV · รอบเช้า','ทุกวัน · 08:30','IT','กิตติ, นลิน','8/12'],['02','CCTV · รอบบ่าย','ทุกวัน · 16:00','IT','กิตติ, นลิน','0/12'],['03','ทดสอบ Backup','ทุกศุกร์ · 14:00','IT','วสันต์','0/1']],'58006':[['01','กล้อง CCTV · ห้องควบคุม','08:30 · วันนี้','กิตติ · IT','8/12 ข้อ','กำลังตรวจ'],['02','สำรองข้อมูล · ERP','14:00 · วันนี้','วสันต์ · IT','รอเริ่ม','ถึงกำหนด']],'58007':[['01','กล้อง CCTV · รอบเช้า','กิตติ · 09:12','IT','ผ่าน 10 · ไม่ผ่าน 2','รออนุมัติ']],'58008':[['01','กล้องชั้น 2 ภาพขาดช่วง','DC-2026-014 · จากข้อไม่ผ่าน','IT','ทีม Network','รอส่งแจ้งซ่อม'],['02','NVR-03 พื้นที่เต็ม','DC-2026-013 · SR-2026-038','IT','ทีม CCTV','กำลังทำ']],'58009':[['01','ส่งผลตรวจ CCTV · 09:12','กิตติ · Version 2','IT','หลักฐาน 2 รูป','ตรวจสอบได้'],['02','อนุมัติผล UPS · 09:28','หัวหน้าฝ่าย IT','IT','หลักฐาน 3 รูป','ตรวจสอบได้']]};
let page='58010',favorite=false,role='staff',filter='';function $(s){return document.querySelector(s)}function menu(){return M.find(x=>x[0]===page)}function toast(t){let e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)}
function nav(){let n=$('#nav');n.innerHTML='<p class="muted">DIGITAL CHECKLIST</p>'+M.map(m=>'<button class="'+(m[0]===page?'active':'')+'" data-c="'+m[0]+'"><span class="ico">'+m[2]+'</span> '+m[1]+' <small>'+m[0]+'</small></button>').join('')+'<p class="line">'+(role==='admin'?'ผู้ดูแลบริษัท · ทุกแผนก':role==='audit'?'Audit · อ่านหลักฐาน':'พนักงาน · IT')+'</p>';n.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{page=b.dataset.c;n.classList.remove('open');render()})}
function table(){let a=(D[page]||[]).filter(r=>!filter||r.join(' ').toLowerCase().includes(filter.toLowerCase())),h=page==='58002'?['ID','กลุ่ม','ประเภท','แผนกรับผิดชอบ','จำนวน','สถานะ']:page==='58005'?['ID','แผนตรวจ','ความถี่','แผนก','ผู้ตรวจ','วันนี้']:['ID','รายการ','รายละเอียด','แผนก','ข้อมูล','สถานะ'];let tr=a.map((r,i)=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'<td><button onclick="detail('+i+')">↗</button></td></tr>').join(''),ca=a.map((r,i)=>'<article class="record"><b>'+r[1]+'</b>'+r.slice(2).map(v=>'<p class="line">'+v+'</p>').join('')+'<button onclick="detail('+i+')">รายละเอียด</button></article>').join('');return '<section class="sec"><div class="scroll"><table class="tbl"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'<th>จัดการ</th></tr></thead><tbody>'+tr+'</tbody></table></div><div class="cards">'+(ca||'ไม่พบรายการ')+'</div></section><section class="sec pager"><button disabled>‹</button><button class="current">1</button><button>›</button><span>1-'+a.length+' จาก '+a.length+'</span></section>'}
function filterbar(){return '<section class="sec filters"><div><input id="q" placeholder="ค้นหารหัสหรือชื่อ"><button class="primary" data-do="search">ค้นหา</button><button data-do="clear">ล้าง Filter</button></div><label>แผนก<select><option>ทุกแผนกที่เข้าถึงได้</option><option>ฝ่ายเทคโนโลยีสารสนเทศ</option></select></label><label>สถานะ<select><option>ทั้งหมด</option><option>รออนุมัติ</option></select></label></section>'}
function dashboard(){return '<div class="grid"><section class="sec metric">รอบตรวจวันนี้<strong>34</strong>31 เสร็จแล้ว</section><section class="sec metric">ครบตามเวลา<strong>91%</strong>เพิ่มขึ้น 3%</section><section class="sec metric">รออนุมัติ<strong>6</strong>2 ข้อไม่ผ่าน</section><section class="sec metric">งานแก้ไข<strong>7</strong>1 รอส่ง</section></div><div class="two"><section class="sec"><h2>รอบตรวจวันนี้</h2><p class="line">08:30 · กล้อง CCTV · 8/12 · กำลังตรวจ</p><p class="line">14:00 · สำรองข้อมูล ERP · ถึงกำหนด</p><p class="line">16:00 · กล้อง CCTV รอบบ่าย</p></section><section class="sec dept"><h2>ขอบเขตของฉัน</h2><b>ฝ่ายเทคโนโลยีสารสนเทศ</b><p>กิตติ · กลุ่ม IT · 2 ประเภท</p><small>งานต่างแผนกเห็นเมื่อส่งถึงคุณ</small></section></div>'+table()}
function special(){
if(page==='58001')return '<section class="sec"><h2>ตั้งค่าระบบบริษัท</h2><div class="filters"><label>เตือนก่อนถึงรอบ<input value="30 นาที"></label><label>ช่องทางเตือน<select><option>ในระบบและอีเมล</option></select></label><label>วันหยุด<select><option>เลื่อนไปวันทำการถัดไป</option></select></label><button class="primary" data-do="save">บันทึก</button></div></section>'+table();
if(page==='58002')return '<section class="sec"><h2>โครงสร้าง 2 ระดับ · กลุ่ม → ประเภท</h2><p class="line">กลุ่ม IT · แผนกรับผิดชอบ: ฝ่ายเทคโนโลยีสารสนเทศ → กล้อง CCTV / สำรองข้อมูล</p><small>แผนกเติมจากผู้ Login · ผู้ดูแลบริษัทเลือกแผนกอื่นได้</small></section>'+filterbar()+table();
if(page==='58003')return '<section class="sec"><h2>แบบตรวจ · กล้อง CCTV</h2><p class="line">1. ภาพชัดเจน · ผ่าน/ไม่ผ่าน · ไม่ผ่านให้แนบรูปและรายละเอียด</p><p class="line">2. NVR Online · สร้างงานแก้ไขหลังอนุมัติ</p><button class="primary" data-do="add">＋ เพิ่มข้อ</button></section>'+table();
if(page==='58004')return '<section class="sec"><h2>สายอนุมัติ · ทุกผลตรวจ</h2><div class="route"><span>ผู้ตรวจ IT</span><span>→ หัวหน้าฝ่าย</span><span>→ ผู้จัดการ</span></div><small>ผู้อนุมัติต่างแผนกเห็นเฉพาะรายการที่ส่งถึงตน</small></section>'+table();
if(page==='58005')return '<section class="sec"><h2>รอบตรวจหลายความถี่</h2><div class="route"><span>ทุกวัน · 08:30</span><span>ทุกวัน · 16:00</span><span>ทุกสัปดาห์ · ศุกร์</span><span>ทุกเดือน · วันที่ 1</span><span>ทุกปี · 1 ม.ค.</span></div><p class="line">สร้างรอบแยก · ป้องกันซ้ำ · เก็บเวลาจริงเมื่อล่าช้า</p><button class="primary" data-do="add">＋ เพิ่มรอบ</button></section>'+filterbar()+table();
if(page==='58006')return '<section class="sec"><h2>กล้อง CCTV · รอบเช้า · ฝ่าย IT</h2><p class="line">1. ภาพกล้องชั้น 2 ชัดเจน <button data-do="pass">ผ่าน</button> <button data-do="fail">ไม่ผ่าน</button></p><p class="line">2. NVR ทำงานปกติ <button data-do="pass">ผ่าน</button> <button data-do="fail">ไม่ผ่าน</button></p><small>แนบรูปเมื่อไม่ผ่าน · บันทึกเวลาจริงแม้ส่งช้า · ทุกผลตรวจส่งอนุมัติ</small><p class="line"><button class="primary" data-do="submit">ส่งอนุมัติ</button></p></section>'+table();
if(page==='58007')return '<section class="sec"><h2>กล้อง CCTV · ขั้น 1 จาก 2</h2><div class="route"><span>กิตติ · ส่งแล้ว</span><span>→ หัวหน้าฝ่าย · รออนุมัติ</span><span>→ ผู้จัดการ</span></div><p class="line">ไม่ผ่าน 2 ข้อ · มีภาพหลักฐาน <button data-do="evidence">ดูหลักฐาน</button></p><button data-do="return">ส่งกลับแก้ไข</button> <button class="primary" data-do="approve">อนุมัติ</button></section>'+table();
if(page==='58008')return '<section class="sec"><h2>งานแก้ไขจากข้อไม่ผ่าน</h2><p class="line">DC-2026-014 · ภาพกล้องชั้น 2 ขาดช่วง · รอส่งแจ้งซ่อม</p><p class="line">DC-2026-013 · NVR พื้นที่เต็ม · กำลังดำเนินการ</p><small>ปลายทางไม่พร้อมจะค้างคิวและแจ้งผู้ดูแล</small><p><button class="primary" data-do="handoff">ส่งงานที่เลือก</button></p></section>'+filterbar()+table();
if(page==='58009')return '<section class="sec"><h2>Audit Trail · CCTV</h2><p class="line">09:12 · กิตติส่ง Version 2 · 12 ข้อ · รูป 2 ภาพ</p><p class="line">09:28 · หัวหน้าฝ่ายอนุมัติขั้น 1</p><label>ข้อสังเกต Audit<input placeholder="เพิ่มข้อสังเกต โดยไม่แก้ผลอนุมัติ"></label><button class="primary" data-do="observation">บันทึกข้อสังเกต</button></section>'+table();
return dashboard()}
function render(){nav();let m=menu(),can=['58002','58003','58004','58005'].includes(page)&&role!=='audit';$('#main').innerHTML='<section class="sec caption"><div class="cap"><span class="ico">'+m[2]+'</span><h1>'+m[1]+'</h1><button class="star" data-do="favorite">'+(favorite?'★':'☆')+'</button></div><div class="tools"><button aria-label="สลับ List/Card">▦</button>'+(can?'<button class="primary" data-do="add">＋ เพิ่ม</button>':'')+'</div></section>'+special();let q=$('#q');if(q)q.value=filter;$('#main').onclick=e=>{let a=e.target.closest('[data-do]');if(!a)return;let d=a.dataset.do;if(d==='search'){filter=$('#q').value;render()}else if(d==='clear'){filter='';render()}else if(d==='add')add();else if(d==='favorite'){favorite=!favorite;render()}else if(d==='return')returnWork();else toast(({pass:'บันทึกผลผ่านแล้ว',fail:'แนบรูปและระบุเหตุผลที่ไม่ผ่าน',submit:'ส่งอนุมัติแล้ว · เก็บ Snapshot',approve:'อนุมัติแล้ว · ส่งขั้นถัดไป',handoff:'ส่งเข้าคิวแจ้งซ่อมแล้ว',evidence:'เปิดภาพหลักฐาน',observation:'บันทึกข้อสังเกตแล้ว',save:'บันทึกค่าตัวอย่างแล้ว'})[d]||'บันทึกแล้ว')}}
function add(){let group=page==='58002',round=page==='58005';$('#dt').textContent=menu()[1]+' · เพิ่ม';$('#db').innerHTML=group?'<label>ชื่อกลุ่ม *<input placeholder="เช่น IT"></label><label>แผนกรับผิดชอบ *<select><option>ฝ่ายเทคโนโลยีสารสนเทศ · จากผู้ Login</option><option>ฝ่ายอาคารสถานที่</option></select></label><small>พนักงานใช้แผนกตน · ผู้ดูแลบริษัทเลือกแผนกอื่นได้</small>':round?'<label>ชื่อรอบ *<input value="CCTV · รอบบ่าย"></label><label>ความถี่<select><option>รายวัน</option><option>รายสัปดาห์</option><option>รายเดือน</option><option>รายปี</option></select></label><label>เวลา<input type="time" value="16:00"></label><label>กลุ่ม<select><option>IT · ฝ่ายเทคโนโลยีสารสนเทศ</option></select></label>':'<label>ชื่อรายการ *<input placeholder="ระบุชื่อ"></label><label>กลุ่ม<select><option>IT</option></select></label>';$('#dlg').showModal()}
function detail(i){$('#dt').textContent='รายละเอียดรายการ';$('#db').innerHTML='<p>แผนกรับผิดชอบ: ฝ่ายเทคโนโลยีสารสนเทศ</p><label>หมายเหตุ<input placeholder="รายละเอียดเพิ่มเติม"></label>';$('#dlg').showModal()}
function returnWork(){$('#dt').textContent='ส่งกลับแก้ไข';$('#db').innerHTML='<label>เหตุผล *<input required placeholder="ระบุข้อที่ต้องแก้ไข"></label><small>เก็บฉบับเดิมและเปิด Version ใหม่</small>';$('#dlg').showModal()}
$('#form').onsubmit=e=>{e.preventDefault();$('#dlg').close();toast('บันทึกข้อมูลตัวอย่างแล้ว')};$('#cancel').onclick=()=>$('#dlg').close();$('#hamb').onclick=()=>$('#nav').classList.toggle('open');
$('#theme').onchange=e=>document.documentElement.style.setProperty('--p',e.target.selectedIndex?'#2859a5':'#087d68');
$('#role').onchange=e=>{role=['staff','admin','audit'][e.target.selectedIndex];render()};render();
</script>
</body></html>
