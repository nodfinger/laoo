:10px;align-items:start}.panel{padding:16px}.panel-heading{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.image-stage{min-height:246px;display:grid;place-items:center;position:relative;border:1px dashed var(--border);border-radius:var(--radius);background:var(--background);padding:20px;overflow:hidden}.business-card{background:var(--paper);width:100%;max-width:420px;aspect-ratio:1.7;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:22px;color:var(--ink);transform-origin:center}.business-card .company{color:var(--primary);font-weight:750;font-size:var(--section)}.business-card .person{font-weight:700;font-size:var(--title)}.business-card small{display:block}.business-card.back{text-align:center;justify-content:center;gap:12px}.uploaded{max-width:100%;max-height:230px;object-fit:contain}.crop-on::after{content:'';position:absolute;inset:25px;border:2px dashed var(--primary);pointer-events:none}.tabs button[aria-pressed=true]{background:var(--soft);border-color:var(--primary)}.upload-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.fields .wide{grid-column:1/-1}.field-head{display:flex;gap:8px;align-items:center;min-height:24px;margin-bottom:5px}.field-head label{display:flex;gap:6px;align-items:center}.field-head small{margin-left:auto}.raw-lines{display:grid;gap:4px;margin-top:10px}.raw-lines button{justify-content:flex-start;text-align:left;font-weight:400;min-height:40px;color:var(--ink);overflow-wrap:anywhere}.footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}.search-form{display:grid;grid-template-columns:minmax(100px,280px) auto auto;gap:8px;width:fit-content;max-width:100%}.search-form button,.search-form input{min-height:40px}.tablebox{padding:0;overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);overflow-wrap:anywhere}th{background:var(--soft);color:var(--primary);height:56px}td:nth-child(2){width:112px}.action-row{display:flex;gap:4px;flex-wrap:nowrap}.action-row button{width:44px;padding:6px}.records{display:none;gap:6px}.record{padding:14px 16px;background:var(--paper);border-radius:var(--radius);overflow-wrap:anywhere}.card-mode .tablebox{display:none}.card-mode .records{display:grid}.pagination{height:56px;display:flex;align-items:center;gap:6px;padding:10px}.pagination button{min-height:34px;width:34px;padding:3px;border-color:var(--primary)}.pagination span{margin-left:6px}.empty{padding:30px;text-align:center;color:var(--muted)}.settings{max-width:720px}.settings-form{display:grid;gap:16px}.toast{position:fixed;right:16px;top:66px;z-index:100;max-width:min(420px,calc(100vw - 32px));background:color-mix(in srgb,var(--primary) 50%,transparent);backdrop-filter:blur(14px);color:var(--caption);padding:12px;display:flex;gap:8px;border-radius:var(--radius);box-shadow:0 4px 18px #0002}.toast.error{background:color-mix(in srgb,var(--error) 50%,transparent)}.toast button{min-height:32px;width:32px;padding:0;color:var(--caption)}dialog{width:calc(100vw - 48px);max-width:480px;max-height:calc(100dvh - 48px);padding:0;border:0;border-radius:var(--radius);background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0006}dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}.dialog-head{display:flex;gap:10px;align-items:center;min-height:48px;padding:10px;border-bottom:1px solid var(--border);flex-shrink:0}.dialog-body{overflow:auto;padding:14px 10px;display:grid;gap:16px;min-height:0}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px;border-top:1px solid var(--border);flex-shrink:0}.dialog-foot button:first-child{min-width:84px}.dialog-foot button:last-child{min-width:100px}.dialog-body .fields{grid-template-columns:1fr;margin:0}.dialog-body .status-line{display:flex;align-items:center;gap:8px}.delete-dialog{border:1px solid var(--error)}.delete-dialog .dialog-head,.delete-dialog .dialog-head h1{color:var(--error)}.delete-dialog .primary{background:var(--error);border-color:var(--error)}

<body>
<header class="top"><button class="icon mobile-menu" id="menu" aria-label="เปิดเมนู">☰</button><div class="brand"><span class="brand-mark">L</span><span>LAOO Platform</span></div><div class="shortcuts" id="shortcuts"><small>เมนูลัด</small></div><span class="small muted">DEMO · พ่อมนต์</span></header>
<div class="shell"><nav class="side" id="navigation" aria-label="เมนูหลัก"></nav><main><div class="draftbar"><span>แบบร่างโต้ตอบ · ข้อมูลตัวอย่าง · ยังไม่อ่าน OCR หรือบันทึกฐานจริง</span><label class="row">ธีมตัวอย่าง<select id="theme"><option value="green">เขียว LAOO</option><option value="blue">น้ำเงิน</option><option value="purple">ม่วง</option></select></label></div><div id="page" class="stack"></div></main></div>

<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const icon=n=>'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[n]+'"/></svg>';
const menus={scan:{name:'อ่านนามบัตร',icon:'scan'},contacts:{name:'ทะเบียนผู้ติดต่อ',icon:'people',code:'55002',type:1},customers:{name:'ข้อมูลลูกค้า',icon:'building',code:'09001',type:1},visitors:{name:'ผู้มาติดต่อ',icon:'visit'},settings:{name:'ตั้งค่า OCR นามบัตร',icon:'settings',code:'55001',type:2}};

const sample={name:'ธนกร ใจดี',company:'บริษัท แสงไทย เทคโนโลยี จำกัด',position:'ผู้จัดการฝ่ายขาย',phone:'081-000-0123',email:'thanakorn@example.com',website:'https://example.com',line:'',address:'99 ถนนตัวอย่าง แขวงบางนาเหนือ เขตบางนา กรุงเทพฯ 10260'};

const initialRows=[{...sample,id:1},{...sample,id:2,name:'พิมพ์ชนก แสงสว่าง',company:'บริษัท ตัวอย่างงานบริการและการสื่อสารเพื่อองค์กร จำกัด',email:'pim@example.com',phone:'082-000-0456'},{...sample,id:3,name:'กิตติ ศรีสุข',email:'kitti@example.com',phone:'083-000-0789'},{...sample,id:4,name:'วรัญญา ยินดี',email:'waranya@example.com',phone:'084-000-0001'}];
const rows={contacts:structuredClone(initialRows),customers:structuredClone(initialRows.slice(0,2)),visitors:structuredClone(initialRows.slice(0,1))};
const state={page:'scan',target:'contacts',side:'front',sample:'thai',stage:'ready',fields:{},selected:new Set(),favorite:new Set(),cardView:false,search:'',pageIndex:0,linked:null,rotation:0,crop:false,images:{front:null,back:null},settings:{enabled:true,maxMB:10,timeout:30,alert:3},pending:null,readTimer:null,slot:'1'};
let toastTimer,saveHandler;
function notify(message,detail='',error=false){clearTimeout(toastTimer);const el=$('#toast');el.hidden=false;el.classList.toggle('error',error);el.innerHTML='<div><strong>'+esc(message)+'</strong>'+(detail?'<div class="small">รายละเอียดเพิ่มเติม: '+esc(detail)+'</div>':'')+'</div><button aria-label="ปิดข้อความแจ้งเตือน">×</button>';el.querySelector('button').onclick=()=>el.hidden=true;toastTimer=setTimeout(()=>el.hidden=true,state.settings.alert*1000)}
function closeDialog(){$('#dialog').close();$('#dialog').classList.remove('delete-dialog')}
$('#cancel').onclick=closeDialog;
$('#dialogForm').onsubmit=e=>{e.preventDefault();if(e.target.reportValidity()&&saveHandler)saveHandler(new FormData(e.target))};
function openDialog(title,body,handler,{save='บันทึก',symbol='people'}={}){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogIcon').innerHTML=icon(symbol);$('#save').innerHTML=icon('save')+esc(save);saveHandler=handler;$('#dialog').showModal()}
function go(page){clearTimeout(state.readTimer);if(state.stage==='loading')state.stage='ready';state.page=page;state.search='';state.pageIndex=0;$('#navigation').classList.remove('open');render()}
function favorites(){$('#shortcuts').innerHTML='<small>เมนูลัด</small>'+[...state.favorite].map(k=>'<button data-shortcut="'+k+'">'+esc(menus[k].name)+'</button>').join('');$('#shortcuts').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.shortcut))}
function caption(key,actions=''){const m=menus[key];return '<section class="card caption"><div class="caption-title"><span class="accent">'+icon(m.icon)+'</span><h1>'+m.name+'</h1></div><button class="icon" id="favorite" aria-label="เพิ่มหรือนำออกจากเมนูลัด" aria-pressed="'+state.favorite.has(key)+'">'+icon('star')+'</button><div class="actions">'+actions+'</div></section>'}
function bindFavorite(){$('#favorite').onclick=()=>{state.favorite.has(state.page)?state.favorite.delete(state.page):state.favorite.add(state.page);$('#favorite').setAttribute('aria-pressed',String(state.favorite.has(state.page)));favorites();notify(state.favorite.has(state.page)?'เพิ่มในเมนูลัดแล้ว':'นำออกจากเมนูลัดแล้ว')}}

$('#menu').onclick=()=>$('#navigation').classList.toggle('open');
$('#theme').onchange=e=>{const t={green:['#147d64','#eaf5f0'],blue:['#245cb6','#edf3fc'],purple:['#7053a3','#f3eff9']}[e.target.value];document.documentElement.style.setProperty('--primary',t[0]);document.documentElement.style.setProperty('--soft',t[1])};

function clearResult(){clearTimeout(state.readTimer);state.stage='ready';state.fields={};state.selected.clear();state.linked=null}
function drawCard(){const holder=$('#imageStage');if(!holder)return;const uploaded=state.images[state.side];if(uploaded){holder.innerHTML='<img class="uploaded" alt="รูปนามบัตรที่แนบ">';holder.firstChild.src=uploaded;holder.firstChild.style.transform='rotate('+state.rotation+'deg) scale('+(state.rotation%180?.65:1)+')';return}const data=state.sample==='english'?english:sample;holder.innerHTML='<div class="business-card '+(state.side==='back'?'back':'')+'" style="transform:rotate('+state.rotation+'deg) scale('+(state.rotation%180?.65:1)+')">'+(state.side==='back'?'<div class="company">SANGTHAI TECHNOLOGY</div><div>'+esc(english.address)+'</div><small>example.com · LINE: @example</small>':'<div class="company">'+esc(data.company)+'</div><div><div class="person">'+esc(data.name)+'</div><small>'+esc(data.position)+'</small></div><div><small>'+esc(data.phone)+' · '+esc(data.email)+'</small><small>example.com</small></div>')+'</div>'}

function updateTargetNote(){$('#targetNote').textContent=state.target==='visitors'?'ปลายทาง Visitor ใน Draft รับชื่อและโทรศัพท์ ช่องอื่นแสดงให้ตรวจ แต่จะไม่นำเข้า':state.target==='customers'?'เลือกผู้ติดต่อคนที่ 1 หรือ 2 • LINE ID ยังไม่มีช่องรองรับในแบบฟอร์มลูกค้าเดิม':'สร้างผู้ติดต่ออิสระ หรือเลือกเชื่อมรายการที่พบ โดยยังไม่สร้างบัญชี Login'}
function updateDuplicate(){const el=$('#duplicate');if(!el)return;const f=state.fields,norm=v=>(v||'').trim().toLowerCase();const matches=state.stage==='review'?rows[state.target].filter(r=>(f.email&&norm(r.email)===norm(f.email))||(f.phone&&r.phone.replace(/\D/g,'')===f.phone.replace(/\D/g,''))||(f.name&&norm(r.name)===norm(f.name))):[];el.hidden=!matches.length;if(!matches.length){state.linked=null;return}el.innerHTML='<strong>พบข้อมูลที่อาจซ้ำ '+matches.length+' รายการ</strong><p class="small">ตรวจรายการก่อนเลือก ระบบจะไม่นำมารวมกันเอง</p>'+matches.map(r=>'<div class="row spread"><span>'+esc(r.name)+'<br><small>'+esc(r.email)+'</small></span><button type="button" data-link="'+r.id+'">'+(state.linked===r.id?'เลือกแล้ว':'ใช้รายการนี้')+'</button></div>').join('');el.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{state.linked=+b.dataset.link;updateDuplicate()})}
function renderRaw(){const el=$('#rawLines');if(state.stage!=='review'){el.innerHTML='<small>ยังไม่มีผลอ่าน</small>';return}const original=state.sample==='english'?english:sample;const text=Object.values(original).filter(Boolean);if(state.sample==='bilingual')text.push(english.name,english.company,'LINE: @example');if(state.sample==='multi')text.push('02-000-0456');el.innerHTML=text.map(t=>'<button type="button">'+esc(t)+'</button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=$('#rawTarget').value,input=$('#reviewForm [name="'+k+'"]');input.value=b.textContent;$('#reviewForm [name="use_'+k+'"]').checked=true;syncFields();$('#reviewed').checked=false;updateDuplicate();input.focus()})}
function analyze(){if(!state.settings.enabled||state.stage==='loading')return;state.stage='loading';state.linked=null;renderScan();bindFavorite();state.readTimer=setTimeout(()=>{if(['empty','timeout','error'].includes(state.sample)){state.stage='ready';state.fields={};state.selected.clear();renderScan();bindFavorite();const errors={empty:['อ่านไม่พบข้อความ','ลองถ่ายใหม่ให้ตัวอักษรชัดและมีแสงเพียงพอ'],timeout:['ประมวลผลไม่ทันเวลาที่กำหนด','ลองใหม่หรือกรอกข้อมูลเองได้'],error:['เครื่องมืออ่านไม่พร้อมใช้งาน','ลองใหม่ภายหลัง หรือกรอกข้อมูลด้วยตนเอง']};notify(...errors[state.sample],true);return}state.fields={...(state.sample==='english'?english:sample)};if(state.sample==='blur'){state.fields.name='ธนกร ใจ?';state.fields.position='';state.fields.address=''}if(state.sample==='bilingual')state.fields.line='@example';if(state.sample==='multi')state.fields.phone='081-000-0123 / 02-000-0456';state.selected=new Set(fieldDefs.filter(([k])=>state.fields[k]).map(([k])=>k));state.stage='review';renderScan();bindFavorite();notify('อ่านข้อมูลตัวอย่างแล้ว','ตรวจรูปและข้อมูลทุกช่องก่อนนำเข้า')},650)}
function applyResult(){
 syncFields();if(!$('#reviewed').checked){notify('กรุณาตรวจข้อมูลก่อนนำเข้า','ทำเครื่องหมายยืนยันหลังตรวจช่องที่เลือกแล้ว',true);$('#reviewed').focus();return}
 if(!state.selected.size){notify('ยังไม่ได้เลือกข้อมูล','เลือกอย่างน้อยหนึ่งช่องที่จะนำเข้า',true);return}
 const allowed=state.target==='visitors'?['name','phone']:state.target==='customers'?fieldDefs.map(x=>x[0]).filter(k=>k!=='line'):fieldDefs.map(x=>x[0]),applied={},skipped=[];
 state.selected.forEach(k=>allowed.includes(k)?applied[k]=state.fields[k]:skipped.push(fieldDefs.find(x=>x[0]===k)[1]));
 const selected=rows[state.target].find(r=>r.id===state.linked), pending=state.pending?.target===state.target?state.pending:null;
 let base=selected?{...selected}:pending?{...pending.values}:{};
 if(selected&&state.target==='customers'&&state.slot==='2')base={...selected,name:'',phone:'',position:'',email:'',...(selected.contact2||{})};
 const conflicts=Object.keys(applied).filter(k=>base[k]&&base[k]!==applied[k]);
 const proceed=()=>{openRecord(state.target,selected?.id||pending?.id||null,{...base,...applied},state.slot,skipped);if(skipped.length)notify('บางช่องไม่รองรับในปลายทาง',skipped.join(', '))};
 if(conflicts.length){openDialog('ยืนยันข้อมูลที่จะเปลี่ยน','<p>ช่องที่เลือกจะเปลี่ยนจากข้อมูลเดิมดังนี้</p>'+conflicts.map(k=>'<div><strong>'+fieldDefs.find(x=>x[0]===k)[1]+'</strong><p class="small">เดิม: '+esc(base[k])+'<br>ใหม่: '+esc(applied[k])+'</p></div>').join(''),()=>{closeDialog();proceed()},{save:'ยืนยันนำเข้า',symbol:'scan'})}else proceed();
}
function upload(e){const file=e.target.files[0];e.target.value='';if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){notify('ชนิดไฟล์ไม่รองรับ','ใช้ JPG, PNG หรือ WebP',true);return}if(file.size>state.settings.maxMB*1024*1024){notify('รูปมีขนาดเกินกำหนด','เลือกรูปไม่เกิน '+state.settings.maxMB+' MB',true);return}if(state.images[state.side])URL.revokeObjectURL(state.images[state.side]);state.images[state.side]=URL.createObjectURL(file);state.rotation=0;clearResult();renderScan();bindFavorite();notify('แสดงรูปที่เลือกแล้ว','Draft ยังใช้ผล OCR ตัวอย่าง ไม่ใช่ข้อความจากรูปนี้')}
$('#imagePicker').onchange=upload;$('#cameraPicker').onchange=upload;

function openRecord(target,id=null,imported=null,slot='1',skipped=[]){
 let record=imported||rows[target].find(r=>r.id===id)||{};if(!imported&&target==='customers'&&slot==='2')record={...record,name:'',phone:'',email:'',position:'',...(record.contact2||{})};

 openDialog(menus[target].name+' > '+(id?'แก้ไข':'เพิ่ม'),'<label class="status-line"><input type="checkbox" name="active" '+(record.active===false?'':'checked')+'> สถานะใช้งาน</label><button type="button" id="scanFromForm">'+icon('scan')+' อ่านจากนามบัตร</button>'+(target==='customers'?'<label>ข้อมูลผู้ติดต่อ<select id="formSlot"><option value="1" '+(slot==='1'?'selected':'')+'>ผู้ติดต่อคนที่ 1</option><option value="2" '+(slot==='2'?'selected':'')+'>ผู้ติดต่อคนที่ 2</option></select></label>':'')+(skipped.length?'<p class="notice warning small">ไม่นำเข้าช่อง: '+esc(skipped.join(', '))+'</p>':'')+'<div class="fields">'+defs.map(([k,l])=>'<label>'+l+(k==='name'?' *':'')+'<input name="'+k+'" value="'+esc(record[k]||'')+'" '+(k==='name'?'required':'')+' maxlength="'+(k==='address'?1000:250)+'"></label>').join('')+'</div>'+(target==='contacts'?'<label>เชื่อมกับลูกค้า<select name="customer"><option value="">ยังไม่เชื่อม</option>'+rows.customers.map(r=>'<option value="'+r.id+'" '+(String(record.customer)===String(r.id)?'selected':'')+'>'+esc(r.company)+'</option>').join('')+'</select></label>':'')+'<p class="small muted">ข้อมูลทดลองในหน้านี้เท่านั้น ไม่มีการสร้างบัญชีหรือรายการเข้าพบจริง</p>',f=>{

 },{symbol:menus[target].icon});
 if($('#formSlot'))$('#formSlot').onchange=e=>{const next=e.target.value;closeDialog();openRecord(target,id,null,next)};

}
function deleteRecord(target,id){const record=rows[target].find(r=>r.id===id);openDialog('ยืนยันลบข้อมูล','<div class="notice warning">'+esc(record.name)+'</div><p>เมื่อลบแล้วไม่สามารถเรียกคืนได้</p>',()=>{rows[target]=rows[target].filter(r=>r.id!==id);closeDialog();render();notify('ลบข้อมูลทดลองแล้ว')},{save:'ลบ',symbol:'trash'});$('#dialog').classList.add('delete-dialog')}
function renderSettings(){$('#page').innerHTML=caption('settings')+'<section class="card panel"><form class="settings-form settings" id="settingsForm"><label class="row"><input type="checkbox" name="enabled" '+(state.settings.enabled?'checked':'')+'> เปิดใช้งาน OCR นามบัตร</label><div class="notice"><strong>อ่านภายใน Server · ไทย / อังกฤษ</strong><p class="small">ไม่มีการส่งภาพไป Cloud ใน Phase 1</p></div><div class="control-grid"><label>ขนาดภาพสูงสุด (MB)<input name="maxMB" type="number" min="1" max="10" step="1" required value="'+state.settings.maxMB+'"></label><label>เวลาประมวลผลสูงสุด (วินาที)<input name="timeout" type="number" min="5" max="120" step="1" required value="'+state.settings.timeout+'"></label></div><label>เวลา Alert จำลองจากส่วนกลาง (วินาที)<input name="alert" type="number" min="1" max="30" step="1" required value="'+state.settings.alert+'"></label><p class="small muted">ระบบจริงอ่าน TimeAlert จาก Company Setup ส่วนช่องนี้มีไว้ทดลอง Draft</p><div class="footer"><button type="submit" class="primary">'+icon('save')+' บันทึก</button></div></form></section>';$('#settingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.settings={enabled:f.has('enabled'),maxMB:+f.get('maxMB'),timeout:+f.get('timeout'),alert:+f.get('alert')};notify('บันทึกค่าตัวอย่างแล้ว')}}
render();
</script>
</body>
