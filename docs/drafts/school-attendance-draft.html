<!doctype html><html lang=th><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>LAOO School Draft</title>
<style>
@font-face{font-family:n;src:url('../../assets/fonts/NotoSansThai-Variable.ttf')}*{box-sizing:border-box}:root{--p:#087f5b;--s:#e9f5f0;--b:#d9dfdc;--bg:#f5f7f8;--r:#dc3545}body{margin:0;background:var(--bg);font:14px/1.5 n,Tahoma;color:#18211e}button,input,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 30%,transparent)}header{height:58px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 14px}.logo{width:36px;height:36px;border-radius:4px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:800}.grow{flex:1}.role{height:36px;border:0;border-radius:4px;background:#fff}.role.on{background:var(--p);color:#fff}.theme,.field{height:48px;border:1px solid var(--b);border-radius:4px;background:#fff;padding:0 10px}.theme{height:40px}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 58px)}aside{background:#fff;border-right:1px solid var(--b);padding:10px}.nav{width:100%;height:48px;border:0;border-radius:4px;background:#fff;text-align:left}.nav:hover,.nav.on{background:var(--s);color:var(--p);font-weight:700}main{min-width:0;padding:9px}.card{background:#fff;border-radius:4px}.cap{min-height:62px;padding:10px;display:flex;align-items:center;gap:9px;margin-bottom:7px}.cap i{font-size:24px;color:var(--p)}.cap h1{font-size:18px;margin:0}.actions{margin-left:auto}.btn{height:48px;min-width:84px;border:1px solid var(--p);border-radius:4px;background:#fff;color:var(--p);font-size:13px;font-weight:700;padding:0 12px}.pri{min-width:100px;background:var(--p);color:#fff}.filters{padding:10px;display:grid;grid-template-columns:1.5fr repeat(3,1fr) auto;gap:8px;margin-bottom:7px}.metrics,.students{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px}.metric,.student,.panel,.form,.portal>div{padding:14px}.metric strong{display:block;font-size:28px}.tag{padding:3px 9px;border-radius:99px;background:#edf1ef;font-size:12px}.ok{background:#e5f5ed;color:#16845b}.late{background:#fff1d7;color:#996000}.bad{background:#fde9eb;color:var(--r)}.info{background:#e9f2fb;color:#2475c8}.dash,.news,.portalgrid,.today{display:grid;grid-template-columns:1.3fr .7fr;gap:7px}.bar{display:grid;grid-template-columns:105px 1fr 40px;gap:8px;margin:12px 0}.track{height:10px;background:#edf1ef}.fill{height:100%;background:var(--p)}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid var(--b);text-align:left}th{background:#eaf2ef;color:var(--p)}.lesson{padding:13px;display:flex;gap:12px;align-items:center;margin-bottom:7px}.time{background:var(--p);color:#fff;padding:10px;border-radius:4px}.time b{display:block;font-size:21px}.states{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.states button{height:44px;border:1px solid var(--b);border-radius:4px;background:#fff}.states .on{background:var(--s);border-color:var(--p);color:var(--p)}.student.pick{border:1px solid var(--p);background:var(--s)}.save{position:sticky;bottom:7px;padding:9px;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.editor{min-height:150px;border:1px solid var(--b);padding:10px}.cover{height:130px;background:linear-gradient(135deg,var(--p),#42b883);color:#fff;display:grid;place-items:center;font-size:40px}.login{min-height:70vh;display:grid;place-items:center}.loginbox{width:min(420px,100%);padding:24px}.loginbox .btn{width:100%;margin-top:16px}.portal{max-width:1050px;margin:auto}.kids{display:flex;gap:7px}.kid{height:70px;border:1px solid var(--b);background:#fff;border-radius:4px}.kid.on{background:var(--s);border-color:var(--p)}.toast{position:fixed;right:14px;top:70px;background:#087f5b80;color:#fff;padding:13px;border-radius:4px;display:none}@media(max-width:900px){aside{display:none}.shell{grid-template-columns:1fr}.metrics,.students{grid-template-columns:repeat(2,1fr)}.dash,.news,.portalgrid{grid-template-columns:1fr}}@media(max-width:560px){.filters,.grid,.today{grid-template-columns:1fr}.metrics,.students{grid-template-columns:1fr 1fr}.brand{display:none}.theme{width:130px}}
@media(max-width:900px){body{overflow-x:hidden}.shell{grid-template-columns:minmax(0,1fr);min-width:0}aside{display:block;width:100%;max-width:100vw;border:0;border-bottom:1px solid var(--b);overflow-x:auto;padding:6px}aside>b{display:none}#nav{display:flex;width:max-content}.nav{min-width:150px;text-align:center}.metrics,.students{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{padding:0 8px}.brand,.theme,.cap .actions{display:none}#roles{display:flex}.role{padding:0 6px;font-size:12px}.cap{min-height:56px}}
@media(max-width:560px){header{width:100vw;max-width:100vw;padding:0 8px}.brand,.theme,.cap .actions,.grow{display:none}#roles{display:flex;margin-left:auto}.role{padding:0 6px;font-size:12px}}
</style></head><body>
<header><div class=logo>L</div><div class=brand><b>LAOO School</b> — โรงเรียนสาธิต</div><div class=grow></div><div id=roles></div><select id=theme class=theme><option>Emerald</option><option>Indigo</option><option>Rose</option></select></header><div class=shell><aside><b>ระบบบันทึกเวลาโรงเรียน</b><div id=nav></div></aside><main id=main></main></div><div id=toast class=toast></div>
<script>
const cap=(key,action='')=>`<section class='card cap'><i>${icon[key]}</i><h1>${title[key]}${action?' > '+action:''}</h1><div class=actions><button class=btn onclick='toast()'>☆ เมนูลัด</button></div></section>`;
const icon={dashboard:'⌂',attendance:'◷',rollcall:'✓',people:'♙',schedule:'▦',news:'✉',reports:'▥',guardian:'♢'};
const title={dashboard:'ภาพรวมวันนี้',attendance:'ลงเวลาเข้า–ออกโรงเรียน',rollcall:'เช็กชื่อรายคาบ',people:'นักเรียนและผู้ปกครอง',schedule:'ตารางเรียนและรอบเรียน',news:'ข่าวสารถึงผู้ปกครอง',reports:'รายงานเวลาเรียน',guardian:'มุมผู้ปกครอง'};
const p={dashboard:()=>cap('dashboard')+`<section class='metrics'><div class='card metric'>นักเรียนทั้งหมด<strong>1,248</strong><small>42 ห้องเรียน</small></div><div class='card metric'>มาเรียนแล้ว<strong>1,176</strong><small>94.2%</small></div><div class='card metric'>มาสาย / ขาด<strong>38 / 34</strong><small>ติดตาม 6 คน</small></div><div class='card metric'>คาบปัจจุบัน<strong>คาบ 2</strong><small>09:20–10:10 น.</small></div></section>`,/*ATTENDANCE*//*ROLLCALL*//*PEOPLE*//*SCHEDULE*//*NEWS*//*REPORTS*//*GUARDIAN*/};
p.attendance=()=>cap('attendance')+`<section class='card filters'><input class=field placeholder='ค้นหารหัสหรือชื่อนักเรียน'><select class=field><option>ทุกระดับชั้น</option><option>มัธยมศึกษาปีที่ 3</option></select><select class=field><option>ทุกรอบเรียน</option></select><input class=field type=date value='2026-10-03'><button class='btn pri'>ค้นหา</button></section><section class='card table'><table><thead><tr><th>รหัส</th><th>นักเรียน</th><th>ชั้น/ห้อง</th><th>เข้า</th><th>ออก</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody><tr><td>660214</td><td><b>ด.ช. ภูมิพัฒน์ แสงทอง</b></td><td>ม.3/2</td><td>07:42</td><td>–</td><td><span class='tag ok'>ปกติ</span></td><td><button class=btn onclick='toast(\'บันทึกเวลาแล้ว\')'>ลงเวลา</button></td></tr><tr><td>660229</td><td><b>ด.ญ. พิมพ์ชนก ดีพร้อม</b></td><td>ม.3/2</td><td>08:17</td><td>–</td><td><span class='tag late'>มาสาย</span></td><td><button class=btn>แก้ไข</button></td></tr></tbody></table></section>`;
p.rollcall=()=>cap('rollcall')+`<section class='card lesson'><div class=time><b>08:30</b>ถึง 09:20</div><div><b>ภาษาอังกฤษ · ห้อง 304</b><div>มัธยมศึกษาปีที่ 3/2 · ครูศิริพร</div></div><div class=actions><span class='tag ok'>บันทึกแล้ว 29/32</span></div></section><section class=students>${['ภูมิพัฒน์','พิมพ์ชนก','ณัฐดนัย','ชนาภา','ภาคิน','ปวีณ์'].map((x,i)=>`<article class='card student'><b>${i+1}. ${x}</b><div class=states><button class='${i%3?'':'on'}'>มา</button><button class='${i==1?'on':''}'>สาย</button><button>ลา</button><button class='${i==3?'on':''}'>ขาด</button></div></article>`).join('')}</section><section class='card save'><button class=btn>ยกเลิก</button> <button class='btn pri' onclick='toast(\'บันทึกการเช็กชื่อแล้ว\')'>✓ บันทึก</button></section>`;
p.people=()=>cap('people')+`<section class='card panel'><b>ทะเบียนแยก:</b> ผู้ปกครองและบัญชี Login แยกจาก Person ส่วนกลาง เชื่อมกับนักเรียนผ่านความสัมพันธ์ผู้ดูแลเท่านั้น</section><section class='card filters'><input class=field placeholder='ค้นหานักเรียนหรือผู้ปกครอง'><select class=field><option>ทุกระดับชั้น</option></select><select class=field><option>สถานะทั้งหมด</option></select><span></span><button class='btn pri'>＋ เพิ่ม</button></section><section class='card table'><table><thead><tr><th>นักเรียน</th><th>ชั้น/ห้อง</th><th>ผู้ปกครอง</th><th>ความสัมพันธ์</th><th>Email Login</th><th>สถานะ</th></tr></thead><tbody><tr><td><b>ด.ช. ภูมิพัฒน์</b><br>660214</td><td>ม.3/2</td><td>คุณวราภรณ์</td><td>มารดา</td><td>waraporn@example.com</td><td><span class='tag ok'>ใช้งาน</span></td></tr></tbody></table></section>`;
p.schedule=()=>cap('schedule')+`<section class='card filters'><select class=field><option>ระดับชั้น ม.3</option></select><select class=field><option>ห้อง ม.3/2</option></select><select class=field><option>รอบปกติ</option></select><input class=field type=date value='2026-10-03'><button class='btn pri'>＋ เพิ่มคาบ</button></section><section class='card table'><table><thead><tr><th>คาบ</th><th>เวลา</th><th>วิชา</th><th>ห้องเรียน</th><th>ครูผู้สอน</th><th>ต้องเช็กชื่อ</th></tr></thead><tbody><tr><td>1</td><td>08:30–09:20</td><td>ภาษาอังกฤษ</td><td>304</td><td>ครูศิริพร</td><td><span class='tag ok'>ใช่</span></td></tr><tr><td>2</td><td>09:20–10:10</td><td>คณิตศาสตร์</td><td>304</td><td>ครูอนันต์</td><td><span class='tag ok'>ใช่</span></td></tr></tbody></table></section>`;
p.news=()=>cap('news','เพิ่ม')+`<section class='card form'><div class=grid><label>หัวข้อข่าว<input class='field full' value='แจ้งวันหยุดพิเศษ'></label><label>ประเภท<select class='field full'><option>ประกาศโรงเรียน</option><option>เฉพาะผู้ปกครอง</option></select></label><label>กลุ่มผู้รับ<select class='field full'><option>ผู้ปกครองทั้งหมด</option><option>ระดับชั้น / ห้อง</option><option>รายบุคคล</option></select></label><label class=full>เนื้อหา<div class=editor contenteditable=true>โรงเรียนขอแจ้งวันหยุดพิเศษ...</div></label><label class=full>ไฟล์แนบ<input class='field full' type=file></label></div><div class=save><button class=btn>บันทึกร่าง</button> <button class='btn pri' onclick='toast(\'ส่งข่าวสารแล้ว\')'>ส่งข่าวสาร</button></div></section>`;
p.reports=()=>cap('reports')+`<section class='card filters'><select class=field><option>รายวัน</option><option>รายเดือน</option><option>รายปี</option></select><select class=field><option>ทุกระดับชั้น</option></select><select class=field><option>นักเรียนทั้งหมด</option></select><input class=field type=date value='2026-10-03'><button class='btn pri'>ส่งออก</button></section><section class=metrics><div class='card metric'>อัตรามาเรียน<strong>94.2%</strong></div><div class='card metric'>ตรงเวลา<strong>91.1%</strong></div><div class='card metric'>มาสาย<strong>38</strong></div><div class='card metric'>ขาด / ลา<strong>34 / 18</strong></div></section><section class='card table'><table><thead><tr><th>นักเรียน</th><th>มาเรียน</th><th>มาสาย</th><th>ลา</th><th>ขาด</th><th>รวมเวลาเรียน</th></tr></thead><tbody><tr><td>ด.ช. ภูมิพัฒน์ แสงทอง</td><td>18 วัน</td><td>1</td><td>0</td><td>0</td><td>98%</td></tr></tbody></table></section>`;
p.guardian=()=>cap('guardian')+`<section class=portal><div class=kids><button class='kid on'>ภูมิพัฒน์ · ม.3/2</button><button class=kid>ภูมิใจ · ป.4/1</button></div><section class=portalgrid><div class='card panel'><h2>เวลาเรียนวันนี้</h2><p><span class='tag ok'>เข้า 07:42 น.</span> ประตูหน้า</p><p>ภาษาอังกฤษ <b>มาเรียน</b> · 08:30–09:20</p><p>คณิตศาสตร์ <b>มาเรียน</b> · 09:20–10:10</p></div><div class='card panel'><h2>ข่าวสารโรงเรียน</h2><p><b>แจ้งวันหยุดพิเศษ</b><br><small>วันนี้ 09:15 น.</small></p><p><b>ประชุมผู้ปกครอง</b><br><small>1 ต.ค. 2569</small></p></div></section></section>`;
const menus=['dashboard','attendance','rollcall','people','schedule','news','reports','guardian'];let current='dashboard';
document.querySelector('.brand').innerHTML='<b>LAOO School</b> — โรงเรียนสาธิต';document.querySelector('aside b').textContent='ระบบบันทึกเวลาโรงเรียน';
document.getElementById('roles').innerHTML=`<button class='role on' data-role='staff'>เจ้าหน้าที่</button><button class=role data-role='teacher'>ครู</button><button class=role data-role='parent'>ผู้ปกครอง</button>`;
document.getElementById('nav').innerHTML=menus.map(k=>`<button class=nav data-key='${k}'><span>${icon[k]}</span> ${title[k]}</button>`).join('');document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>show(x.dataset.key));
function show(k){current=k;document.getElementById('main').innerHTML=p[k]();document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.key==k));window.scrollTo(0,0)}
function toast(msg){let x=document.getElementById('toast');x.textContent='✓ '+msg;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',3000)}
document.getElementById('theme').onchange=e=>{let v=e.target.value,r=document.documentElement;let colors=v=='Indigo'?['#4f46e5','#eeefff']:v=='Rose'?['#c0265e','#fff0f5']:['#087f5b','#e9f5f0'];r.style.setProperty('--p',colors[0]);r.style.setProperty('--s',colors[1])};
document.querySelectorAll('.role').forEach(x=>x.onclick=()=>{document.querySelectorAll('.role').forEach(y=>y.classList.remove('on'));x.classList.add('on');if(x.dataset.role=='parent')show('guardian');else show(x.dataset.role=='teacher'?'rollcall':'dashboard')});try{show('dashboard')}catch(e){document.getElementById('main').innerHTML='<section class=card><pre>'+e.stack+'</pre></section>'}
</script></body></html>
