<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAOO SPORT · Draft</title><style>
@font-face{font-family:NotoSansThai;src:url('../../assets/fonts/NotoSansThai-Variable.ttf')}
:root{--p:#087d68;--soft:#e9f3ef;--bg:#f8f9fb;--line:#dce4e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 NotoSansThai,Tahoma,sans-serif}button,input,select{font:inherit}
button{min-height:48px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--p);padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--p);outline-offset:2px}.primary{background:var(--p);border-color:var(--p);color:#fff}input,select{width:100%;height:48px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:10px}h1,h2,p{margin:0}h1{font-size:18px;color:#000}h2{font-size:16px}.row{display:flex;align-items:center;gap:8px;min-width:0}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.card{background:#fff;border-radius:4px;padding:10px;margin-bottom:6px;min-width:0}.icon{color:var(--p);font-size:23px}.muted,small{color:#66736f}
.draft{background:#e7eeeb;padding:5px 12px}.draft select{width:auto;height:34px}.header{height:52px;background:#fff;padding:0 14px;border-bottom:1px solid var(--line)}.brand{color:var(--p);font-weight:800}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100dvh - 94px)}nav{background:#fff;border-right:1px solid var(--line);padding:10px}nav button{display:block;width:100%;text-align:left;border:0;margin:2px 0}nav button.active{background:var(--soft)}main{padding:10px;min-width:0}.caption{min-height:62px}.star{border:0;font-size:20px}.mobilemenu{display:none}
.filter{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filter label{width:min(250px,100%)}label{display:grid;gap:4px;min-width:0}.tablewrap{overflow:auto;padding:0}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--p);background:#edf5f2}.paging{height:56px;display:flex;align-items:center;gap:6px}.paging button{min-height:34px;width:34px;padding:0}.mobilecards{display:none}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tiles strong{display:block;font-size:24px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.doc{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:6px}.subhead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.schedule{overflow:auto}.grid{min-width:650px;display:grid;grid-template-columns:80px repeat(4,minmax(130px,1fr));border:1px solid var(--line);border-radius:4px}.grid>*{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.grid .label{background:#edf5f2;font-weight:700}.grid button{border:0;border-radius:0;min-height:75px;text-align:left}.grid .booked{background:#e8eceb;color:#172622}.grid .pending{background:#fff1d9;color:#855b15}.badge{display:inline-block;padding:3px 7px;border-radius:4px;background:var(--soft);color:var(--p);font-size:12px}.badge.pending{background:#fff1d9;color:#855b15}.portal{background:var(--soft)}.portal strong{font-size:26px;color:var(--p)}
dialog{width:480px;max-width:calc(100vw - 48px);max-height:calc(100dvh - 48px);border:0;border-radius:4px;padding:0}dialog::backdrop{background:#0007}.dialogbox{display:flex;flex-direction:column;max-height:calc(100dvh - 48px)}.dialogbox header,.dialogbox footer{padding:10px;border-bottom:1px solid var(--line)}.dialogbox footer{border-top:1px solid var(--line);border-bottom:0;display:flex;justify-content:flex-end;gap:8px}.dialogbox footer button:first-child{min-width:84px}.dialogbox footer .primary{min-width:100px}.dialogbody{padding:10px;overflow:auto;display:grid;gap:16px}.toast{position:fixed;right:14px;top:108px;z-index:5;background:color-mix(in srgb,var(--p) 50%,transparent);backdrop-filter:blur(10px);color:#fff;border-radius:4px;padding:12px 16px;box-shadow:0 4px 14px #0003}.toast[hidden]{display:none}
@media(max-width:1050px){.doc{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:899px){.shell{display:block}nav{display:none}nav.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line)}.mobilemenu{display:block}.tablewrap{display:none}.mobilecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.mobilecards article{background:#fff;border-radius:4px;padding:12px;overflow-wrap:anywhere}}@media(max-width:550px){.draft .hint{display:none}.header{height:56px}.brand{font-size:12px}.caption .title,.caption .right{width:100%}.caption .right{justify-content:flex-end}.filter label{width:100%}.filter button{flex:1}.tiles,.mobilecards,.formgrid{grid-template-columns:1fr}.paging{font-size:12px}}
</style></head><body>
<div class="draft row wrap"><strong>แบบร่าง · LAOO SPORT</strong><span class="hint grow muted">ข้อมูลจำลอง · ไม่มี API หรือฐานข้อมูล</span><label class="row">มุมมอง <select id="role"><option value="staff">พนักงาน</option><option value="member">สมาชิก</option></select></label><label class="row">สีผู้ใช้ <select id="theme"><option value="green">เขียว</option><option value="blue">น้ำเงิน</option></select></label></div>
<header class="header row"><button id="menu" class="mobilemenu" aria-label="เลือกเมนู">☰</button><span class="brand">▣ LAOO / SPORT</span><span class="grow"></span><span id="who" class="muted">พนักงาน · สาขาสุขุมวิท</span></header>
<div class="shell"><nav id="nav" aria-label="เมนูระบบ"></nav><main id="main"></main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><form id="form" class="dialogbox"><header class="row"><span class="icon">▣</span><h1 id="dialogTitle"></h1></header><div id="dialogBody" class="dialogbody"></div><footer><button type="button" id="cancel">ยกเลิก</button><button class="primary" type="submit">▣ บันทึก</button></footer></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const menus=[['54001','ตั้งค่าระบบกีฬา','⚙'],['54002','ประเภทกีฬา','◇'],['54003','สนามและพื้นที่','▦'],['54004','ระดับสมาชิก','♢'],['54005','แพ็กเกจและราคา','▣'],['54006','ข้อมูลสมาชิก','♙'],['54007','สมัครและต่ออายุ','▤'],['54008','จองสนาม','▦'],['54009','เช็กอินเข้าเล่น','✓'],['54010','กฎราคา POS','⌑'],['54011','Dashboard และรายงาน','◫']];
const data={54002:[['BAD','แบดมินตัน','2 สนาม','ใช้งาน'],['BASKET','บาสเกตบอล','1 สนาม','ใช้งาน'],['FIT','ฟิตเนส','1 ห้อง','ใช้งาน']],54003:[['สนามแบด 1','แบดมินตัน','สุขุมวิท','เปิด'],['สนามแบด 2','แบดมินตัน','สุขุมวิท','เปิด'],['สนามบาส A','บาสเกตบอล','สุขุมวิท','เปิด'],['ห้องฟิตเนส','ฟิตเนส','พระราม 9','เปิด']],54004:[['YEAR','รายปี','สมาชิกทั่วไป','ใช้งาน'],['ROOM','ผู้พักอาศัย','ผูกกับห้องพัก','ใช้งาน'],['VISIT','รายครั้ง','ไม่มีแพ็กเกจ','ใช้งาน']],54005:[['FIT-YEAR','ฟิตเนสรายปี','ฟิตเนส','365 วัน','9,900 บาท'],['COURT-20','แบด + บาส 20 ครั้ง','แบด + บาส','180 วัน','4,500 บาท'],['RESIDENT','ผู้พักอาศัยรายครั้ง','ทุกประเภท','ต่อครั้ง','120 บาท']],54006:[['SP-001','ณัฐชา พิทักษ์','รายปี','ฟิตเนส + แบด','15/11/2569'],['SP-002','ปกรณ์ สุขดี','ผู้พักอาศัย','บาสเกตบอล','08/10/2569'],['SP-003','รตี วัฒนะ','รายครั้ง','—','—']]};
const state={page:'54008',role:'staff',checked:false,favorites:[],bookings:[{court:'สนามแบด 1',time:'18:00',name:'ณัฐชา พิทักษ์',status:'ยืนยันแล้ว'},{court:'สนามบาส A',time:'19:00',name:'ปกรณ์ สุขดี',status:'รอชำระ'}]};const $=s=>document.querySelector(s);
function toast(t){let e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.hidden=true,3000)}
function caption(code,action){let m=menus.find(x=>x[0]===code)||['','สิทธิ์และประวัติของฉัน','◷'];return '<section class="card caption row wrap"><div class="title row grow"><span class="icon">'+m[2]+'</span><h1>'+m[1]+'</h1><button class="star" aria-label="เมนูลัด" onclick="favorite(\''+code+'\')">'+(state.favorites.includes(code)?'★':'☆')+'</button></div><div class="right row">'+(action||'')+'</div></section>'}
function favorite(c){state.favorites=state.favorites.includes(c)?state.favorites.filter(x=>x!==c):state.favorites.concat(c);render()}
function section(h,b){return '<section class="card"><div class="subhead"><h2>'+h+'</h2></div>'+b+'</section>'}
function filters(){return '<section class="card filter"><label><small>ค้นหา</small><input placeholder="ค้นหารหัสหรือชื่อ"></label><label><small>สาขา</small><select><option>ทุกสาขา</option><option>สุขุมวิท</option><option>พระราม 9</option></select></label><button class="primary" onclick="toast(\'กรองข้อมูลตัวอย่างแล้ว\')">⌕ ค้นหา</button><button onclick="toast(\'ล้างตัวกรองแล้ว\')">ล้าง Filter</button></section>'}
function paging(n){return '<section class="card paging"><button disabled>&lt;</button><button class="primary">1</button><button disabled>&gt;</button><span>1-'+n+' จาก '+n+'</span></section>'}
function table(cols,rows){return '<section class="card tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th>จัดการ</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'<td><button onclick="edit('+i+')">✎</button></td></tr>').join('')+'</tbody></table></section><section class="mobilecards">'+rows.map((r,i)=>'<article><h3>'+r[1]+'</h3>'+r.map((v,j)=>'<p><small>'+cols[j]+'</small> '+v+'</p>').join('')+'<button onclick="edit('+i+')">✎ แก้ไข</button></article>').join('')+'</section>'+paging(rows.length)}
function modal(t,fields,done){$('#dialogTitle').textContent=t;$('#dialogBody').innerHTML=fields.map(f=>'<label><small>'+f[0]+'</small><input value="'+(f[1]||'')+'"></label>').join('');$('#form').onsubmit=e=>{e.preventDefault();$('#dialog').close();done?done():toast('บันทึกข้อมูลตัวอย่างแล้ว')};$('#dialog').showModal()}
function edit(i){let m=menus.find(x=>x[0]===state.page);modal(m[1]+' > แก้ไข',[['รหัส',data[state.page][i][0]],['ชื่อ',data[state.page][i][1]]])}
function add(){let m=menus.find(x=>x[0]===state.page);modal(m[1]+' > เพิ่ม',[['รหัส',''],['ชื่อ','']])}
function master(){let c=state.page,r=data[c],cols=c==='54005'?['รหัส','แพ็กเกจ','กีฬา','สิทธิ์','ราคา']:c==='54006'?['รหัส','สมาชิก','ระดับ','กีฬา','หมดอายุ']:['รหัส/ชื่อสนาม','ชื่อ/ประเภท','รายละเอียด/สาขา','สถานะ'];return caption(c,'<button class="primary" onclick="add()">＋ เพิ่ม</button>')+filters()+table(cols,r)}
function settings(){return caption('54001')+section('ค่าเริ่มต้นการจอง','<div class="formgrid"><label>รอชำระ (นาที)<input value="30"></label><label>ยกเลิกก่อนเริ่ม (ชั่วโมง)<input value="2"></label><label>เช็กอินช้าได้ (นาที)<input value="15"></label><label>แจ้งเตือนก่อนหมดอายุ (วัน)<input value="30"></label></div><p style="text-align:right;margin-top:16px"><button class="primary" onclick="toast(\'บันทึกค่าจำลองแล้ว\')">▣ บันทึก</button></p>')}
function enrollment(){return caption('54007')+'<div class="doc"><div>'+section('Header · สมัคร / ต่ออายุ','<div class="formgrid"><label>สมาชิก<input value="SP-002 · ปกรณ์ สุขดี"></label><label>วันที่เริ่ม<input value="04/10/2569"></label><label>แพ็กเกจ<select><option>แบด + บาส 20 ครั้ง</option><option>ฟิตเนสรายปี</option></select></label><label>สาขารับเงิน<select><option>สุขุมวิท</option></select></label></div>')+section('Detail · สิทธิ์และราคา','<p>แบดมินตัน + บาสเกตบอล · 20 ครั้ง · 180 วัน <strong>4,500 บาท</strong></p><small>Snapshot สิทธิ์และราคา ณ วันสมัคร</small>')+section('รับชำระที่เคาน์เตอร์','<div class="formgrid"><label>วิธีชำระ<select><option>เงินสด</option><option>โอนเงิน</option></select></label><label>เลขอ้างอิง<input placeholder="เลขสลิป/ใบรับเงิน"></label></div><p style="text-align:right;margin-top:16px"><button class="primary" onclick="toast(\'บันทึกการสมัครจำลองแล้ว\')">▣ บันทึกการสมัคร</button></p>')+'</div><aside>'+section('สรุปก่อนบันทึก','<p>ปกรณ์ สุขดี · 20 ครั้ง</p><p>หมดอายุ 02/04/2570</p><h2>ยอดรับ 4,500 บาท</h2>')+'</aside></div>'}
function booking(){let courts=['สนามแบด 1','สนามแบด 2','สนามบาส A','ห้องฟิตเนส'],hours=['17:00','18:00','19:00','20:00'];let g='<div class="grid"><div class="label">เวลา</div>'+courts.map(c=>'<div class="label">'+c+'</div>').join('');hours.forEach(t=>{g+='<div class="label">'+t+'</div>';courts.forEach(c=>{let b=state.bookings.find(x=>x.court===c&&x.time===t);g+='<button class="'+(b?(b.status==='รอชำระ'?'pending':'booked'):'')+'" '+(b?'disabled':'onclick="book(this)" data-court="'+c+'" data-time="'+t+'"')+'>'+(b?b.name+'<br><small>'+b.status+'</small>':'＋ ว่าง · จองได้')+'</button>'})});g+='</div>';return caption('54008','<button class="primary" onclick="book()">＋ จองสนาม</button>')+'<section class="card filter"><label>วันที่<input value="04/10/2569"></label><label>สาขา<select><option>สุขุมวิท</option><option>พระราม 9</option></select></label><label>กีฬา<select><option>ทุกประเภท</option><option>แบดมินตัน</option></select></label></section>'+section('ตารางสนาม · วันอาทิตย์ 4 ตุลาคม 2569','<div class="schedule">'+g+'</div><p><span class="badge">ว่าง</span> <span class="badge pending">รอชำระ 30 นาที</span> <span class="badge">ยืนยันแล้ว</span></p>')+paging(state.bookings.length)}
function book(btn){let c=btn?.dataset.court||'สนามแบด 2',t=btn?.dataset.time||'18:00';modal('จองสนาม > เพิ่ม',[['สนาม',c],['เวลาเริ่ม',t],['สมาชิก','SP-003 · รตี วัฒนะ'],['สิทธิ์','รายครั้ง · รอชำระ']],()=>{state.bookings.push({court:c,time:t,name:'รตี วัฒนะ',status:'รอชำระ'});render();toast('จองตัวอย่างแล้ว · รอชำระที่เคาน์เตอร์')})}
function checkin(){return caption('54009')+filters()+section('รายการเข้าเล่นวันนี้','<div class="row wrap"><div class="grow"><strong>SP-001 · ณัฐชา พิทักษ์</strong><p>สนามแบด 1 · 18:00–19:00 · ใช้แพ็กเกจ 1 ครั้ง</p><small>คงเหลือ 8 ครั้ง · ตัดสิทธิ์เมื่อเช็กอินจริง</small></div><button class="primary" '+(state.checked?'disabled':'')+' onclick="state.checked=true;render();toast(\'เช็กอินตัวอย่างแล้ว\')">'+(state.checked?'✓ เช็กอินแล้ว':'✓ เช็กอิน')+'</button></div>')+paging(1)}
function pricing(){return caption('54010')+section('ราคาสินค้าตามระดับสมาชิก','<p>สินค้าและสต๊อกจาก POS เดิม · API ตรวจสิทธิ์และราคาอีกครั้งตอนขาย</p><div class="formgrid"><label>ระดับสมาชิก<select><option>รายปี</option><option>ผู้พักอาศัย</option><option>รายครั้ง</option></select></label><label>ระดับราคา POS<select><option>SPORT_YEAR</option><option>SPORT_ROOM</option><option>ราคาปกติ</option></select></label></div><p style="text-align:right;margin-top:16px"><button class="primary" onclick="toast(\'บันทึกกฎราคาจำลองแล้ว\')">▣ บันทึก</button></p>')+section('ตัวอย่างใบขาย','<p>น้ำดื่ม 500 มล. · ราคาปกติ 15 บาท → สมาชิกรายปี 12 บาท</p><small>ใบขายเก็บระดับสมาชิกและราคาที่ใช้ ณ เวลาขาย</small>')}

function portal(){return caption('PORTAL')+'<section class="card portal row wrap"><div class="grow"><small>SP-001 · ณัฐชา พิทักษ์</small><h2>ฟิตเนส + แบดมินตัน</h2><p>ใช้ได้ถึง 15/11/2569 · สาขาสุขุมวิท</p></div><div><small>คงเหลือ</small><strong>8 ครั้ง</strong></div></section><section class="tiles"><article class="card"><h2>จองครั้งถัดไป</h2><strong>วันนี้ 18:00</strong><p>สนามแบด 1</p></article><article class="card"><h2>ประวัติการเล่น</h2><strong>12 ครั้ง</strong><p>ล่าสุด 02/10/2569</p></article><article class="card"><h2>ราคาสมาชิก</h2><strong>12 บาท</strong><p>น้ำดื่มผ่าน POS</p></article></section>'+section('จองสนามด้วยตนเอง','<p>เลือกสนามว่าง → ยืนยันการจอง → เช็กอินเพื่อใช้สิทธิ์</p><button class="primary" onclick="state.page=\'54008\';render()">▦ ดูช่วงเวลาว่าง</button>')+section('ประวัติการเล่น','<p>02/10/2569 · แบดมินตัน · สนามแบด 1 · 1 ครั้ง</p><p>28/09/2569 · ฟิตเนส · ห้องฟิตเนส · 1 ครั้ง</p>')}
